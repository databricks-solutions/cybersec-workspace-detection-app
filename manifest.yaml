- path: base/detections/event-based/metastore_admin_privilege_granted.py
  dscc:
    author: Kotaiba Alachkar
    created: '2026-02-06T12:00:00'
    modified: '2026-02-06T12:00:00'
    uuid: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
    content_type: detection
    detection:
      name: Metastore Admin Privilege Granted
      description: Detects when metastore ownership is changed or when users/SPNs are added
        to designated metastore admin groups.
      objective: Identify metastore admin privilege grants through metastore ownership changes
        (updateMetastore with owner field) or by adding specific users/SPNs/nested groups
        to monitored metastore admin groups. Uses a configurable widget to specify known metastore
        admin group names (comma-separated). Metastore admin is a high-level Unity Catalog
        privilege that grants complete control over managing catalogs, schemas, tables, views,
        and all data access permissions. Unauthorized grants could indicate privilege escalation
        attempts, insider threats, or compromised accounts attempting to establish persistence
        and gain unauthorized data access.
    version: 1.0.0
- path: base/detections/event-based/trufflehog_scan_detected.py
