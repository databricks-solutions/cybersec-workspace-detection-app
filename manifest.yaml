- path: base/detections/event-based/account_admin_privileged_role_assignment.py
  dscc:
    author: Kotaiba Alachkar
    created: '2026-02-06T12:00:00'
    modified: '2026-02-06T12:00:00'
    uuid: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    content_type: detection
    detection:
      name: Account Admin Privileged Role Assignment
      description: Detects when account admin privileges are assigned to specific users or
        service principals through direct privilege grants, or when users/SPNs are added to
        designated account admin groups.
      objective: Identify targeted and granular account admin privilege grants through direct
        assignment to individual principals (setAccountAdmin, setAdmin), account ownership
        changes (changeAccountOwner), or by adding specific users/SPNs to monitored account
        admin groups. Uses a configurable widget to specify known account admin group names
        (comma-separated). This detection focuses on individual and targeted privilege escalation
        events rather than group-level role assignments. Account admin is the highest privilege
        level in Databricks and grants complete control over workspace management, billing,
        user management, and security settings. Unauthorized grants could indicate privilege
        escalation attempts, insider threats, or compromised accounts attempting to establish
        persistence.
    version: 1.0.0
- path: base/detections/event-based/configuration_changes_account_level.py
  dscc:
    author: David Veuve - Databricks
    created: '2025-06-04T12:00:00'
    modified: '2025-06-04T12:00:00'
    uuid: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    content_type: detection
    detection:
      name: Account Level Configuration Changes
      description: Detects when users modify account-level settings, which could indicate
        privilege escalation attempts or unauthorized administrative changes to tenant-wide
        configurations.
      objective: Identify potentially suspicious account-level configuration changes that
        could affect the entire Databricks tenant. These modifications might indicate attempts
        to escalate privileges, weaken security controls, or establish persistence at the
        tenant level. Maps to MITRE ATT&CK TA0004 - Privilege Escalation - T1484 - Domain
        or Tenant Policy Modification.
    version: 1.0.0
