    modified: '2025-07-24T12:00:00'
    uuid: b6500154-4635-43e4-b1fd-a2b59791a4bc
    content_type: detection
    detection:
      name: Encoded Command Execution in SQL or Notebook Commands
      description: Detects SQL statements or notebook commands that use encoding/decoding
        functions (UNHEX, xxd, base64) to obfuscate and execute arbitrary commands. Attackers
        embed hex- or base64-encoded payloads inside SQL or shell expressions to evade content-based
        controls.
      objective: Identify SQL or notebook commands that contain encoded payloads decoded at
        runtime — a classic command-injection obfuscation technique observed in Databricks
        pen tests and red-team exercises. Encoded commands are used to hide curl exfiltration,
        reverse shells, and credential harvesting from plain-text keyword detections. Maps
        to MITRE ATT&CK TA0005 - Defense Evasion - T1027 - Obfuscated Files or Information,
        and TA0002 - Execution - T1059 - Command and Scripting Interpreter.
    version: 1.0.0
- path: base/detections/behavioral/potential_data_movement_explicit_creds.py
  dscc:
    author: David Veuve - Databricks
    created: '2025-06-04T12:00:00'
    modified: '2025-06-04T12:00:00'
    uuid: 8a4f5c6d-1e2b-4a3c-9f8e-7b5d9a1c3e2f
    content_type: detection
    detection:
      name: Potential Data Movement Commands with Explicit Credentials
      description: Detects events where users execute commands that could involve explicit
        credentials for data movement operations, such as DBFS mounts, storage credential
        operations, or connection management.
      objective: Identify potentially suspicious data movement activities where explicit credentials
        might be provided instead of using existing secure configurations. These operations
        could indicate data exfiltration attempts or unauthorized data movement to external
        cloud accounts. Maps to MITRE ATT&CK TA0010 - Exfiltration - T1537 - Transfer Data
        to Cloud Account.
    version: 1.0.0
- path: base/detections/behavioral/potential_data_movement_sql_queries.py
  dscc:
    author: David Veuve - Databricks
    created: '2025-06-04T12:00:00'
    modified: '2025-06-04T12:00:00'
    uuid: 9b5e6f7a-2c3d-4b4e-8f9a-6c7e8d2f4a3b
    content_type: detection
    detection:
      name: Potential Data Movement Commands with SQL Queries
      description: Detects SQL queries that contain COPY INTO statements with explicit credentials,
        which could indicate data exfiltration attempts using SQL commands with embedded credentials.
      objective: Identify potentially suspicious SQL queries that use COPY INTO commands with
        explicit credentials instead of using secure, pre-configured storage credentials.
        These queries could indicate attempts to exfiltrate data to external locations using
        embedded credentials in SQL statements. Maps to MITRE ATT&CK TA0010 - Exfiltration
        - T1537 - Transfer Data to Cloud Account.
    version: 1.0.0
- path: base/detections/behavioral/potential_data_movement_workspace_downloads.py
  dscc:
    author: David Veuve - Databricks
    created: '2025-06-04T12:00:00'
    modified: '2025-06-04T12:00:00'
    uuid: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
    content_type: detection
    detection:
      name: Potential Data Movement via Workspace Downloads
      description: Detects downloads from the workspace including exports, large query results,
        file downloads, and model artifacts that could indicate data exfiltration attempts.
      objective: Identify potentially suspicious download activities that could indicate data
        exfiltration attempts. This includes large query result downloads, workspace exports
        in non-source formats, file downloads, and model version downloads. These activities
        may indicate unauthorized data movement or intellectual property theft. Maps to MITRE
        ATT&CK TA0010 - Exfiltration - T1567 - Exfiltration Over Web Service.
    version: 1.0.0
- path: base/detections/behavioral/secret_scanning_activity.py
  dscc:
    author: David Veuve - Databricks
    created: '2025-06-04T12:00:00'
    modified: '2025-06-04T12:00:00'
    uuid: 7f3e4b8c-9d2a-4f6e-8b5c-1a9e7d3b4c8f
    content_type: detection
    detection:
      name: Secrets Discovery
      description: Detects when someone enumerates what secrets exist in the environment by
        looking for users who list secret scopes and access multiple secrets.
      objective: Identify potential reconnaissance activities where an attacker or malicious
        insider enumerates available secrets in the environment. This detection triggers when
        users list secret scopes and subsequently access a high number of secrets, which may
        indicate secret discovery or credential harvesting attempts. Maps to MITRE ATT&CK
        TA0007 - Discovery - T1526 - Cloud Service Discovery.
    version: 1.0.0
