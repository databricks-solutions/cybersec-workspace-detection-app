- path: base/detections/event-based/workspace_admin_privileged_role_assignment.py
  dscc:
    author: Kotaiba Alachkar
    created: '2026-02-07T12:00:00'
    modified: '2026-02-07T12:00:00'
    uuid: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
    content_type: detection
    detection:
      name: Workspace Admin Privileged Role Assignment
      description: Detects when workspace admin privileges are assigned to users/SPNs through
        direct admin entitlement grants or additions to the workspace admins group.
      objective: 'Identify workspace admin privilege grants through two mechanisms: (1) Direct
        admin entitlement assignment (setAdmin, addAdmin) which automatically adds principals
        to the admins group, or (2) Direct addition of users/SPNs to the system reserved "admins"
        group. The "admins" group is a fixed system group in every Databricks workspace that
        cannot be removed. Workspace admin grants full administrative control over workspace
        resources including clusters, jobs, notebooks, repos, and workspace settings. Unauthorized
        grants could indicate privilege escalation attempts, insider threats, or compromised
        accounts attempting to establish persistence.'
    version: 1.0.0
- path: base/detections/behavioral/bulk_notebook_export.py
  dscc:
    author: David Veuve - Databricks
    created: '2026-07-30T12:00:00'
    modified: '2026-07-30T12:00:00'
    uuid: b4b7d1fe-8bfe-4979-85bf-14243ffb96b6
    content_type: detection
    detection:
      name: Bulk Notebook Export
      description: Detects when a principal exports an anomalously high number of distinct
        notebooks in a single day relative to their own historical baseline, which may indicate
        bulk source-code exfiltration.
      objective: Identify potential intellectual property or source-code exfiltration through
        bulk notebook exports. Each principal is measured against their own history using
        a per-user IQR-based fence (Q3 + iqr_multiplier * max(IQR, iqr_floor)), so a user
        who never bulk-exports is flagged at a far lower volume than an automated backup account.
        Self-exports (a principal reading files under its own home directory, e.g. Databricks
        Apps deployment bundles) are excluded as platform noise. Maps to MITRE ATT&CK TA0010
        - Exfiltration - T1567 - Exfiltration Over Web Service.
    version: 1.0.0
