# Planted: a PAT with 10 days of history from 198.51.100.0/24 via the Python SDK is replayed
# from 203.0.113.9 with curl (new /24 AND new client family) -> one signal.
rows:
  # history of the replayed PAT (tok-leak) and of the near-miss credentials
  - {t: -14400, action_name: tokenLogin, email: dana@corp.example, ip: 198.51.100.10, user_agent: databricks-sdk-py/0.40.0,
     request_params: {tokenId: tok-leak, authenticationMethod: API_EXT_PAT_TOKEN}}
  - {t: -14400, action_name: tokenLogin, email: eli@corp.example, ip: 198.51.100.11, user_agent: databricks-sdk-py/0.40.0,
     request_params: {tokenId: tok-newip, authenticationMethod: API_EXT_PAT_TOKEN}}
  - {t: -14400, action_name: tokenLogin, email: fay@corp.example, ip: 198.51.100.12, user_agent: databricks-sdk-py/0.40.0,
     request_params: {tokenId: tok-newua, authenticationMethod: API_EXT_PAT_TOKEN}}
  - {t: -14400, action_name: mintOAuthToken, email: 11111111-2222-3333-4444-555555555555, ip: 198.51.100.13,
     user_agent: databricks-sdk-go/0.50.0, request_params: {client_id: 11111111-2222-3333-4444-555555555555}}
  # in the run window
  - {t: -20, action_name: tokenLogin, email: dana@corp.example, ip: 203.0.113.9, user_agent: curl/8.4.0,
     request_params: {tokenId: tok-leak, authenticationMethod: API_EXT_PAT_TOKEN}}
  - {t: -20, action_name: tokenLogin, email: eli@corp.example, ip: 203.0.113.20, user_agent: databricks-sdk-py/0.41.0,
     request_params: {tokenId: tok-newip, authenticationMethod: API_EXT_PAT_TOKEN}}        # new IP, same client
  - {t: -20, action_name: tokenLogin, email: fay@corp.example, ip: 198.51.100.99, user_agent: python-requests/2.32.0,
     request_params: {tokenId: tok-newua, authenticationMethod: API_EXT_PAT_TOKEN}}        # same /24, new client
  - {t: -20, action_name: tokenLogin, email: gus@corp.example, ip: 203.0.113.30, user_agent: curl/8.4.0,
     request_params: {tokenId: tok-brandnew, authenticationMethod: API_EXT_PAT_TOKEN}}     # no history
  - {t: -20, action_name: oidcTokenAuthorization, email: hal@corp.example, ip: 203.0.113.40, user_agent: curl/8.4.0,
     request_params: {tokenId: tok-useroauth, authenticationMethod: API_OIDC_TOKEN}}       # a user, not an SP
  - {t: -15, action_name: tokenLogin, email: dana@corp.example, ip: 203.0.113.50, user_agent: Go-http-client/1.1,
     status: 401, request_params: {tokenId: tok-leak, authenticationMethod: API_EXT_PAT_TOKEN}}  # refused
  - {t: -10, action_name: mintOAuthToken, email: 11111111-2222-3333-4444-555555555555, ip: 203.0.113.60,
     user_agent: python-requests/2.32.0, request_params: {client_id: 11111111-2222-3333-4444-555555555555}}  # SP replay
expect:
  hits:
    - {actor: dana@corp.example, src_ip: 203.0.113.9, ua_family: curl, actor_kind: user}
    - {actor: 11111111-2222-3333-4444-555555555555, src_ip: 203.0.113.60, actor_kind: sp}
  misses:
    - {actor: eli@corp.example}
    - {actor: fay@corp.example}
    - {actor: gus@corp.example}
    - {actor: hal@corp.example}
    - {src_ip: 203.0.113.50}
