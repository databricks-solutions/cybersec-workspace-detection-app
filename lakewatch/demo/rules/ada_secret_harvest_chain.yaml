catalog_name: "{{catalog}}"
schema_name: "{{schema}}"
rule_name: ada_secret_harvest_chain
description: An identity lists scopes, lists secrets, and reads secrets in two or more scopes within 15 minutes.
severity: High
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: >-
  Stage 3 (harvest). The order listScopes, then listSecrets of a scope, then a successful getSecret
  of that scope, over two or more scopes within 15 minutes of the listScopes. A job reads the
  secrets of its own scope and does not walk the scope list first. The rule is written with window
  functions (no MATCH_RECOGNIZE): each secrets call gets the time of the latest listScopes of the
  identity before it; a scope counts when its listSecrets and a later successful getSecret are in
  the 15 minutes after that listScopes. The history is the 14 days before the run, so a chain that
  starts before the run window is not lost; the last read must be in the window. False positives:
  admin tools that copy secrets between scopes.
references:
  - https://attack.mitre.org/techniques/T1555/006/
mitre:
  - {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1555,
     technique: Credentials from Password Stores, sub_technique_id: T1555.006,
     sub_technique: Cloud Secrets Management Stores}
  - {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1552, technique: Unsecured Credentials}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 7d
schedule: {at_least_every: 1h, enabled: false}
batch:
  warehouse_id: "{{warehouse_id}}"
  sql:
    query: |
      WITH sec AS (
        FROM {{audit_table}}
        |> WHERE service_name = 'secrets' AND action_name IN ('listScopes', 'listSecrets', 'getSecret')
             AND event_time >= TIMERANGE_NOW() - INTERVAL 14 DAYS AND event_time <= TIMERANGE_NOW()
        |> SELECT event_time, user_identity.email AS actor,
                  CASE WHEN user_identity.email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                         OR identity_metadata.acting_resource_type ILIKE '%service principal%'
                       THEN 'sp' ELSE 'user' END AS actor_kind,
                  source_ip_address AS src_ip, action_name, request_params.scope AS scope,
                  request_params.key AS secret_key, response.status_code AS status
        |> WHERE actor IS NOT NULL AND actor <> ''
        |> EXTEND max(CASE WHEN action_name = 'listScopes' THEN event_time END) OVER (
                    PARTITION BY actor ORDER BY event_time
                    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS scopes_listed_at
        |> WHERE scopes_listed_at IS NOT NULL AND event_time <= scopes_listed_at + INTERVAL 15 MINUTES
      ),
      listed AS (
        FROM sec |> WHERE action_name = 'listSecrets'
        |> SELECT actor, scopes_listed_at, scope, event_time AS listed_at
      ),
      reads AS (
        FROM sec |> WHERE action_name = 'getSecret' AND status = 200
      ),
      chains AS (
        FROM reads AS r
        |> JOIN listed AS l
             ON l.actor = r.actor AND l.scopes_listed_at = r.scopes_listed_at AND l.scope = r.scope
            AND l.listed_at <= r.event_time
        |> AGGREGATE max(r.event_time) AS event_time, max_by(r.src_ip, r.event_time) AS src_ip,
                     count(DISTINCT r.scope) AS n_scopes,
                     array_join(array_sort(collect_set(r.scope)), ', ') AS scopes,
                     array_join(array_sort(collect_set(r.secret_key)), ', ') AS secret_keys
           GROUP BY r.actor AS actor, r.actor_kind AS actor_kind, r.scopes_listed_at AS scopes_listed_at
      )
      FROM chains
      |> WHERE n_scopes >= 2 AND IN_TIMERANGE(event_time)
      |> SELECT event_time, actor, actor_kind, src_ip, scopes_listed_at, n_scopes, scopes, secret_keys
output:
  summary: 'Secret harvest over several scopes by {actor}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    stage: '3'
    scopes: '{scopes}'
    secret_keys: '{secret_keys}'
  default_context: false
timerange:
  extend_lookback: 15m
runbook: |
  1. Treat every secret in secret_keys as exposed: find the systems and identities they belong to.
  2. Rotate them, starting with service principal client secrets and cloud keys.
  3. Look for sign-ins of those identities from src_ip after event_time.
