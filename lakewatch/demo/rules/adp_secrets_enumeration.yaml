# Ported from the Lakewatch content pack rule databricks_audit/secrets_enumeration (v1) to the flat v2 rule format of this demo.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: adp_secrets_enumeration
description: Detect when a user enumerated more than 50% of the available secret scopes
severity: Medium
category: Statistical
fidelity: FIDELITY_INVESTIGATIVE
objective: Detect when a user enumerated more than 50% of the available secret scopes
mitre:
- taxonomy: Enterprise
  tactic: Credential Access
  technique_id: T1555
  technique: Credentials from Password Stores
  sub_technique_id: T1555.006
  sub_technique: Cloud Secrets Management Stores
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 7 days
schedule:
  at_least_every: 1h
  enabled: false
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH global_stats AS (
        FROM {{audit_table}}
        |> WHERE
            (event_time >= TIMERANGE_NOW() - INTERVAL 7 DAYS AND event_time <= TIMERANGE_NOW())
            AND service_name = 'secrets'
            AND action_name = 'listSecrets'
        |> AGGREGATE count(DISTINCT request_params.scope) AS total_scope_count
      )

      FROM {{audit_table}}
      |> WHERE
          IN_TIMERANGE(event_time)
          AND service_name = 'secrets'
          AND action_name = 'listSecrets'
      |> AGGREGATE
          count(DISTINCT request_params.scope) AS user_scope_count,
          collect_set(request_params.scope) AS queriedScopes,
          any_value(user_identity.email) AS actor_email,
          bool_or(coalesce(identity_metadata.acting_resource_type ILIKE '%service principal%', false)) AS actor_is_sp
        GROUP BY coalesce(identity_metadata.run_by_display_name, identity_metadata.run_as_display_name) as userDisplayName
      |> JOIN global_stats ON true
      |> SELECT
          userDisplayName,
          queriedScopes,
          user_scope_count,
          global_stats.total_scope_count,
          (user_scope_count / global_stats.total_scope_count) * 100 AS percentage_accessed,
          actor_email,
          actor_is_sp
      |> WHERE total_scope_count > 2 AND percentage_accessed > 50 AND userDisplayName IS NOT NULL
      |> EXTEND actor_email AS actor,
           CASE WHEN actor_is_sp OR actor_email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
           '' AS src_ip,
           TIMERANGE_NOW() AS event_time
output:
  summary: 'Secrets enumeration: {actor}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    stage: '3'
    actor_display: '{userDisplayName}'
    userDisplayName: '{userDisplayName}'
    queriedScopes: '{queriedScopes}'
    user_scope_count: '{user_scope_count}'
    total_scope_count: '{total_scope_count}'
    percentage_accessed: '{percentage_accessed}'
    detail: User {userDisplayName} enumerated {user_scope_count} of {total_scope_count} previously seen secret scopes
      ({percentage_accessed}%)
  default_context: false
timerange:
  extend_lookback: 15m
annotations:
  content_pack: databricks_audit
  pack_rule: secrets_enumeration
