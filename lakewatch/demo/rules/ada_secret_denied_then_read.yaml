catalog_name: "{{catalog}}"
schema_name: "{{schema}}"
rule_name: ada_secret_denied_then_read
description: A secret read is denied in one scope, then the same key is read in another scope within one hour.
severity: High
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: >-
  Stage 3 (harvest). An attacker who is denied a secret (secrets.getSecret, status 1004 = permission
  denied) looks for a copy of the same key in a scope with weaker access, and reads it there (status
  200). The same key name in two scopes is common for copied credentials. The rule joins each denied
  read to a successful read of the same key in a different scope by the same identity in the next
  hour; the successful read must be in the run window. 3002 (not found) is not a denial and is not
  used. One finding per identity and key. False positives: a job that is moved from one scope to
  another while its ACL is not yet set.
references:
  - https://attack.mitre.org/techniques/T1555/006/
mitre:
  - {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1555,
     technique: Credentials from Password Stores, sub_technique_id: T1555.006,
     sub_technique: Cloud Secrets Management Stores}
  - {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1552, technique: Unsecured Credentials}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 7 days
schedule: {at_least_every: 1h, enabled: false}
batch:
  warehouse_id: "{{warehouse_id}}"
  sql:
    query: |
      WITH gets AS (
        FROM {{audit_table}}
        |> WHERE service_name = 'secrets' AND action_name = 'getSecret'
             AND response.status_code IN (200, 1004)
             AND event_time >= TIMERANGE_NOW() - INTERVAL 14 DAYS AND event_time <= TIMERANGE_NOW()
        |> SELECT event_time, user_identity.email AS actor,
                  CASE WHEN user_identity.email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                         OR identity_metadata.acting_resource_type ILIKE '%service principal%'
                       THEN 'sp' ELSE 'user' END AS actor_kind,
                  source_ip_address AS src_ip, request_params.scope AS scope,
                  request_params.key AS secret_key, response.status_code AS status
        |> WHERE actor IS NOT NULL AND actor <> '' AND secret_key IS NOT NULL
      ),
      reads AS (
        FROM gets |> WHERE status = 200 AND IN_TIMERANGE(event_time)
      ),
      denials AS (
        FROM gets |> WHERE status = 1004
      )
      FROM denials AS d
      |> JOIN reads AS r
           ON r.actor = d.actor AND r.secret_key = d.secret_key AND r.scope <> d.scope
          AND r.event_time > d.event_time AND r.event_time <= d.event_time + INTERVAL 1 HOUR
      |> AGGREGATE max(r.event_time) AS event_time, max_by(r.src_ip, r.event_time) AS src_ip,
                   array_join(array_sort(collect_set(d.scope)), ', ') AS denied_scopes,
                   array_join(array_sort(collect_set(r.scope)), ', ') AS read_scopes
         GROUP BY d.actor AS actor, d.actor_kind AS actor_kind, d.secret_key AS secret_key
      |> SELECT event_time, actor, actor_kind, src_ip, secret_key, denied_scopes, read_scopes
output:
  summary: 'Denied secret {secret_key} read from another scope by {actor}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    stage: '3'
    secret_key: '{secret_key}'
    denied_scopes: '{denied_scopes}'
    read_scopes: '{read_scopes}'
  default_context: false
timerange:
  extend_lookback: 15m
runbook: |
  1. The secret secret_key is exposed: rotate it, and remove the extra copy from read_scopes.
  2. Find the identity the secret belongs to and look for its sign-ins from src_ip.
  3. Review who can read read_scopes; it should match denied_scopes.
