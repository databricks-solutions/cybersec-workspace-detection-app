catalog_name: "{{catalog}}"
schema_name: "{{schema}}"
rule_name: ada_first_secret_enumeration
description: An identity lists secret scopes or secrets for the first time in 14 days.
severity: Low
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: >-
  Stage 2 (discovery). Before an attacker reads secrets, they list them (secrets.listScopes,
  secrets.listSecrets). Jobs and people that use secrets do this on a regular schedule, so the first
  listing by an identity is worth a look. For each listing in the run window, the rule looks for the
  same (identity, action) in the 14 days before that call. No earlier call means first-seen. One
  finding per identity. False positives: a new team member, a new job, the first run after a
  14-day pause.
references:
  - https://attack.mitre.org/techniques/T1526/
  - https://attack.mitre.org/techniques/T1555/006/
mitre:
  - {taxonomy: Enterprise, tactic: Discovery, technique_id: T1526, technique: Cloud Service Discovery}
  - {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1555,
     technique: Credentials from Password Stores, sub_technique_id: T1555.006,
     sub_technique: Cloud Secrets Management Stores}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 7 days
schedule: {at_least_every: 1h, enabled: false}
batch:
  warehouse_id: "{{warehouse_id}}"
  sql:
    query: |
      WITH listing AS (
        FROM {{audit_table}}
        |> WHERE service_name = 'secrets' AND action_name IN ('listScopes', 'listSecrets')
             AND event_time >= TIMERANGE_NOW() - INTERVAL 14 DAYS AND event_time <= TIMERANGE_NOW()
        |> SELECT event_time, user_identity.email AS actor,
                  CASE WHEN user_identity.email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                         OR identity_metadata.acting_resource_type ILIKE '%service principal%'
                       THEN 'sp' ELSE 'user' END AS actor_kind,
                  source_ip_address AS src_ip, action_name, request_params.scope AS scope
        |> WHERE actor IS NOT NULL AND actor <> ''
      ),
      candidates AS (
        FROM listing |> WHERE IN_TIMERANGE(event_time)
      )
      FROM candidates AS c
      |> LEFT ANTI JOIN listing AS b
           ON b.actor = c.actor AND b.action_name = c.action_name AND b.event_time < c.event_time
      |> AGGREGATE max(c.event_time) AS event_time, max_by(c.src_ip, c.event_time) AS src_ip,
                   array_join(array_sort(collect_set(c.action_name)), ', ') AS actions
         GROUP BY c.actor AS actor, c.actor_kind AS actor_kind
      |> SELECT event_time, actor, actor_kind, src_ip, actions
output:
  summary: 'First secret enumeration by {actor}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    stage: '2'
    actions: '{actions}'
  default_context: false
timerange:
  extend_lookback: 15m
runbook: |
  1. Is the identity new, or did its job change? Ask the owner.
  2. Check for secrets.getSecret calls by the same identity after the listing.
