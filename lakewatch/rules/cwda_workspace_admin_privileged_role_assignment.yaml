# Generated by lakewatch/tools/build_rules.py from detect_workspace_admin_granted (base/detections/event-based/workspace_admin_privileged_role_assignment.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_workspace_admin_privileged_role_assignment
description: Detects when workspace admin privileges are assigned to users/SPNs through direct admin entitlement
  grants or additions to the workspace admins group.
severity: High
category: Static Signature
fidelity: FIDELITY_HIGH
objective: 'Identify workspace admin privilege grants through two mechanisms: (1) Direct admin entitlement assignment
  (setAdmin, addAdmin) which automatically adds principals to the admins group, or (2) Direct addition of users/SPNs
  to the system reserved "admins" group. The "admins" group is a fixed system group in every Databricks workspace
  that cannot be removed. Workspace admin grants full administrative control over workspace resources including
  clusters, jobs, notebooks, repos, and workspace settings. Unauthorized grants could indicate privilege escalation
  attempts, insider threats, or compromised accounts attempting to establish persistence.'
mitre:
- taxonomy: Enterprise
  tactic: Persistence
  technique_id: T1098
  technique: Account Manipulation
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          CASE WHEN a.action_name IN ('setAdmin','removeAdmin') THEN 'DIRECT' ELSE 'VIA_GROUP' END AS grant_path,
          a.action_name AS action,
          CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
          a.user_identity.email AS actor,
          COALESCE(a.request_params['targetUserName'], a.request_params['target_user_name']) AS target,
          COALESCE(a.request_params['targetGroupName'], a.request_params['target_group_name']) AS target_group,
          CAST(a.workspace_id AS STRING) AS workspace_id,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.request_params AS request_params
        FROM {{audit_table}} AS a
        WHERE IN_TIMERANGE(a.event_time)
          AND (
            a.action_name IN ('setAdmin', 'removeAdmin')
            OR (
              a.service_name = 'accounts'
              AND a.action_name IN ('addPrincipalToGroup', 'addPrincipalsToGroup')
              AND '' IS NOT NULL AND trim('') <> ''
              -- array_contains over a split, NOT `IN (SELECT explode(...))`. The
              -- subquery form creates fine on a SQL warehouse but FAILS inside a UDF
              -- body on DBR (notebook/spark.sql), so the notebook installer could not
              -- create these three functions while the CLI installer could. Verified
              -- live 2026-08-27. Keep this form -- it works on both.
              AND array_contains(
                    transform(split('', ','), x -> trim(x)),
                    COALESCE(a.request_params['targetGroupName'],
                             a.request_params['target_group_name']))
            )
          )
output:
  summary: Workspace admin granted to {target} by {actor} ({grant_path})
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    grant_path: '{grant_path}'
    action: '{action}'
    status: '{status}'
    actor: '{actor}'
    target: '{target}'
    target_group: '{target_group}'
    workspace_id: '{workspace_id}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/event-based/workspace_admin_privileged_role_assignment.py
  source_function: detect_workspace_admin_granted
