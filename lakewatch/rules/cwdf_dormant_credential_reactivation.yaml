catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_dormant_credential_reactivation
description: A PAT idle for at least 30 days, or a service principal idle for at least 90 days, authenticates again
  from a public IP.
severity: Medium
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  Leaked credentials are often old ones -- forgotten CI tokens, departed users, idle integration service principals --
  that the owner stopped using long before an actor found them. Daily, for each external PAT (tokenId) and each
  service principal (OAuth tokens count as their principal) that authenticated successfully from a public IP in the
  run window, the rule finds its previous successful authentication in the year before and reports an idle gap of at
  least 30 days for a PAT or 90 days for a service principal, and whether the IP was seen for that credential before.
  A credential never used before is out of scope (see cwdf_anomalous_credential_minting). False positives: seasonal
  or quarterly jobs, re-enabled integrations.
mitre:
- {taxonomy: Enterprise, tactic: Initial Access, technique_id: T1078, technique: Valid Accounts,
   sub_technique_id: T1078.004, sub_technique: Cloud Accounts}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 24h, enabled: false}
timerange: {extend_lookback: 1h}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH auth AS (
        SELECT CASE WHEN a.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN' THEN a.request_params['tokenId']
                    ELSE a.user_identity.email END AS credential,
               CASE WHEN a.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN' THEN 'pat' ELSE 'sp' END AS credential_type,
               a.user_identity.email AS actor, a.event_time, a.source_ip_address AS src_ip, a.user_agent
        FROM {{audit_table}} AS a
        WHERE a.response.status_code = 200
          AND a.event_time > TIMERANGE_NOW() - INTERVAL 366 DAYS AND a.event_time <= TIMERANGE_NOW()
          AND ((a.action_name = 'tokenLogin' AND a.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN')
               OR (a.action_name IN ('mintOAuthToken', 'oidcTokenAuthorization', 'workspaceInHouseOAuthClientAuthentication',
                                     'accountInHouseOAuthClientAuthentication', 'aadTokenLogin')
                   AND a.user_identity.email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
      ),
      current_use AS (
        SELECT credential, credential_type, max(actor) AS actor, min(event_time) AS reactivated_at,
               max(event_time) AS event_time,
               min_by(src_ip, event_time) AS src_ip, min_by(user_agent, event_time) AS user_agent
        FROM auth
        WHERE IN_TIMERANGE(event_time) AND src_ip IS NOT NULL AND NOT src_ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
        GROUP BY credential, credential_type
      ),
      previous AS (
        SELECT h.credential, max(h.event_time) AS previous_use
        FROM auth AS h JOIN current_use AS c ON c.credential = h.credential AND h.event_time < c.reactivated_at
        GROUP BY h.credential
      ),
      ip_seen AS (
        SELECT DISTINCT h.credential, h.src_ip
        FROM auth AS h JOIN current_use AS c ON c.credential = h.credential AND h.event_time < c.reactivated_at
      )
      SELECT c.event_time AS event_time, c.actor AS actor,
             CASE WHEN c.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             c.src_ip AS src_ip, c.credential AS credential, c.credential_type AS credential_type,
             c.user_agent AS user_agent, c.reactivated_at AS reactivated_at, p.previous_use AS previous_use,
             datediff(c.reactivated_at, p.previous_use) AS idle_days,
             s.src_ip IS NOT NULL AS ip_seen_before
      FROM current_use AS c
      JOIN previous AS p ON p.credential = c.credential
      LEFT JOIN ip_seen AS s ON s.credential = c.credential AND s.src_ip = c.src_ip
      WHERE datediff(c.reactivated_at, p.previous_use) >= CASE WHEN c.credential_type = 'pat' THEN 30 ELSE 90 END
output:
  summary: '{credential_type} of {actor} used again after {idle_days} idle days from {src_ip} (seen before: {ip_seen_before})'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    credential: '{credential}'
    credential_type: '{credential_type}'
    user_agent: '{user_agent}'
    reactivated_at: '{reactivated_at}'
    previous_use: '{previous_use}'
    idle_days: '{idle_days}'
    ip_seen_before: '{ip_seen_before}'
  default_context: false
runbook: |
  1. Ask the owner: is this a seasonal job or a re-enabled integration? Is the owner still active?
  2. ip_seen_before = false makes it more suspicious. Check what the credential did after reactivated_at.
  3. Revoke dormant credentials that are not needed.
annotations:
  source: cybersec-workspace-detection-app
  family: dormant_credential_reactivation
