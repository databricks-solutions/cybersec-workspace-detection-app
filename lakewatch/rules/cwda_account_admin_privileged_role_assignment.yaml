# Generated by lakewatch/tools/build_rules.py from detect_account_admin_granted (base/detections/event-based/account_admin_privileged_role_assignment.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_account_admin_privileged_role_assignment
description: Detects when account admin privileges are assigned to specific users or service principals through
  direct privilege grants, or when users/SPNs are added to designated account admin groups.
severity: High
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Identify targeted and granular account admin privilege grants through direct assignment to individual
  principals (setAccountAdmin, setAdmin), account ownership changes (changeAccountOwner), or by adding specific
  users/SPNs to monitored account admin groups. Uses a configurable widget to specify known account admin group
  names (comma-separated). This detection focuses on individual and targeted privilege escalation events rather
  than group-level role assignments. Account admin is the highest privilege level in Databricks and grants complete
  control over workspace management, billing, user management, and security settings. Unauthorized grants could
  indicate privilege escalation attempts, insider threats, or compromised accounts attempting to establish persistence.
mitre:
- taxonomy: Enterprise
  tactic: Persistence
  technique_id: T1098
  technique: Account Manipulation
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH findings AS (
        SELECT
            a.event_time AS event_time,
            CASE WHEN a.action_name IN ('setAccountAdmin','changeAccountOwner')
                 THEN 'DIRECT' ELSE 'VIA_GROUP' END AS grant_path,
            a.action_name AS action,
            CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
            a.user_identity.email AS actor,
            COALESCE(a.request_params['targetUserName'],
                     a.request_params['target_user_name'],
                     a.request_params['principals']) AS target,
            COALESCE(a.request_params['targetGroupName'], a.request_params['target_group_name']) AS target_group,
            a.source_ip_address AS source_ip,
            a.user_agent AS user_agent,
            a.request_params AS request_params
          FROM {{audit_table}} AS a
          WHERE a.service_name = 'accounts'
            AND IN_TIMERANGE(a.event_time)
            AND (
              a.action_name IN ('setAccountAdmin', 'changeAccountOwner')
              OR (
                a.action_name IN ('addPrincipalToGroup', 'addPrincipalsToGroup')
                AND '' IS NOT NULL AND trim('') <> ''
                -- array_contains over a split, NOT `IN (SELECT explode(...))`. The
                -- subquery form creates fine on a SQL warehouse but FAILS inside a UDF
                -- body on DBR (notebook/spark.sql), so the notebook installer could not
                -- create these three functions while the CLI installer could. Verified
                -- live 2026-08-27. Keep this form -- it works on both.
                AND array_contains(
                      transform(split('', ','), x -> trim(x)),
                      COALESCE(a.request_params['targetGroupName'],
                               a.request_params['target_group_name']))
              )
            )
      )
      -- Allow-list: drop findings that match a row in the allow-list table (tune there, not here)
      SELECT f.* FROM findings AS f
      WHERE NOT EXISTS (
        SELECT 1 FROM {{allowlist_table}} AS al
        WHERE al.rule IN ('*', 'cwda_account_admin_privileged_role_assignment')
          AND (al.expires_at IS NULL OR al.expires_at > TIMERANGE_NOW())
          AND (al.principal IS NOT NULL OR al.src_ip IS NOT NULL)
          AND (al.principal IS NULL OR al.principal = f.actor)
          AND (al.src_ip IS NULL OR al.src_ip = f.source_ip))
output:
  summary: Account admin granted to {target} by {actor} ({grant_path})
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    grant_path: '{grant_path}'
    action: '{action}'
    status: '{status}'
    actor: '{actor}'
    target: '{target}'
    target_group: '{target_group}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/event-based/account_admin_privileged_role_assignment.py
  source_function: detect_account_admin_granted
