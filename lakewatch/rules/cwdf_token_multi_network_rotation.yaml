catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_token_multi_network_rotation
description: One PAT or service principal credential authenticates from many networks in one run -- at least 10
  public /24s, or at least 3 /24s new for that credential.
severity: Medium
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  A token lives in one place; a leaked one is replayed through proxy pools, Tor, rotating hosting exits or several
  actors at once. Per credential (an external PAT's tokenId, or a service principal -- its short-lived OAuth tokens
  count as the principal) over successful authentications from public IPs in the run window, the rule reports at
  least 10 distinct /24 networks, or at least 3 /24s the credential did not use in the 30 days before. Databricks
  platform egress IPs (cluster and Apps / serverless egress) are excluded. Token-keyed counterpart of the session
  rules, which see browser sessions. False positives: a credential shared across CI runners in several clouds; a
  corporate egress pool spanning several /24s on its first use.
mitre:
- {taxonomy: Enterprise, tactic: Defense Evasion, technique_id: T1550, technique: Use Alternate Authentication Material,
   sub_technique_id: T1550.001, sub_technique: Application Access Token}
- {taxonomy: Enterprise, tactic: Command and Control, technique_id: T1090, technique: Proxy,
   sub_technique_id: T1090.003, sub_technique: Multi-hop Proxy}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH platform_ips AS (
        SELECT DISTINCT p.source_ip_address AS ip
        FROM {{audit_table}} AS p
        WHERE IN_TIMERANGE(p.event_time)
          AND (p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')
               OR p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication'))
      ),
      l AS (
        SELECT CASE WHEN a.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN' THEN a.request_params['tokenId']
                    ELSE a.user_identity.email END AS credential,
               a.user_identity.email AS actor, a.event_time, a.user_agent, a.source_ip_address AS src_ip,
               coalesce(nullif(regexp_extract(a.source_ip_address, '^([0-9]+[.][0-9]+[.][0-9]+)[.]', 1), ''),
                        a.source_ip_address) AS net24,
               substring_index(a.source_ip_address, '.', 2) AS net16
        FROM {{audit_table}} AS a
        WHERE a.response.status_code = 200
          AND a.event_time > TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time <= TIMERANGE_NOW()
          AND ((a.action_name = 'tokenLogin' AND a.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN')
               OR (a.action_name IN ('oidcTokenAuthorization', 'mintOAuthToken') AND a.user_identity.email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
          AND a.source_ip_address IS NOT NULL AND NOT a.source_ip_address RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
      ),
      hist AS (SELECT DISTINCT credential, net24 FROM l WHERE event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS)
      SELECT max(w.event_time) AS event_time, max(w.actor) AS actor,
             CASE WHEN max(w.actor) RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             concat_ws(', ', slice(array_sort(collect_set(w.src_ip)), 1, 10)) AS src_ip,
             w.credential AS credential,
             count(DISTINCT w.net24) AS nets24, count(DISTINCT w.net16) AS nets16,
             count(DISTINCT CASE WHEN h.net24 IS NULL THEN w.net24 END) AS new_nets24,
             concat_ws(', ', slice(array_sort(collect_set(w.user_agent)), 1, 5)) AS user_agents,
             min(w.event_time) AS first_time
      FROM l AS w
      LEFT ANTI JOIN platform_ips AS pi ON pi.ip = w.src_ip
      LEFT JOIN hist AS h ON h.credential = w.credential AND h.net24 = w.net24
      WHERE IN_TIMERANGE(w.event_time)
      GROUP BY w.credential
      HAVING count(DISTINCT w.net24) >= 10 OR count(DISTINCT CASE WHEN h.net24 IS NULL THEN w.net24 END) >= 3
output:
  summary: 'Credential of {actor} used from {nets24} networks ({new_nets24} new) in one run'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    credential: '{credential}'
    nets24: '{nets24}'
    nets16: '{nets16}'
    new_nets24: '{new_nets24}'
    user_agents: '{user_agents}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. Who owns the networks in src_ip? Hosting providers, Tor exits or residential proxies indicate replay.
  2. Revoke the PAT or rotate the service principal secret; check what it did from each network.
annotations:
  source: cybersec-workspace-detection-app
  family: token_multi_network_rotation
