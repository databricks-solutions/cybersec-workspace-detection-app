catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_credential_pivot_same_source
description: A credential is first used from the IP that just harvested secrets or credential files, or the IP that
  used a revoked token switches to another credential (or the revoked token still works).
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  Links stolen-credential use to the harvest and checks containment. In the run window the rule reports: the first
  authentication (in 30 days) of a principal's credential from a public IP where, in the 15 minutes before, a
  different principal read a secret or exported a credential-shaped file; and, after a revokeDbToken, any
  authentication from an IP that had used the revoked token -- with another credential, or the revoked token itself.
  Platform egress IPs are excluded (every job of a workspace shares them). False positives: a CI host that reads a
  secret and then authenticates as the service principal whose secret it holds; pipelines rotating between two tokens.
mitre:
- {taxonomy: Enterprise, tactic: Lateral Movement, technique_id: T1550, technique: Use Alternate Authentication Material,
   sub_technique_id: T1550.001, sub_technique: Application Access Token}
- {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1552, technique: Unsecured Credentials}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH platform_ips AS (
        -- Platform egress: IPs Databricks itself authenticates from. An IP counts when it carries a
        -- cluster-internal PAT or in-house OAuth token, or the in-house OAuth client action (Apps,
        -- serverless) from a private address, or that action from a public address at service volume:
        -- one principal at least 200 times in a day. A laptop calling a Databricks App logs the same
        -- action from its own IP, far less often, so it stays in scope. Two days back, so a full day
        -- of service traffic is always in view.
        SELECT ip FROM (
          SELECT p.source_ip_address AS ip, p.user_identity.email AS principal, to_date(p.event_time) AS auth_day,
                 count_if(p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')) AS internal_auth,
                 count_if(p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication')) AS inhouse_auth
          FROM {{audit_table}} AS p
          WHERE p.event_time >= TIMERANGE_NOW() - INTERVAL 2 DAYS AND p.event_time < TIMERANGE_NOW()
            AND (p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')
                 OR p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication'))
          GROUP BY p.source_ip_address, p.user_identity.email, to_date(p.event_time)
        ) AS platform_days
        GROUP BY ip
        HAVING sum(internal_auth) > 0
            OR (sum(inhouse_auth) > 0 AND ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])')
            OR max(inhouse_auth) >= 200
      ),
      auth AS (
        SELECT a.source_ip_address AS src_ip, a.user_identity.email AS actor, a.event_time,
               CASE WHEN a.request_params['authenticationMethod'] = 'API_OIDC_TOKEN' THEN a.user_identity.email
                    ELSE coalesce(a.request_params['tokenId'], a.user_identity.email) END AS credential
        FROM {{audit_table}} AS a
        WHERE a.response.status_code = 200
          AND a.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time < TIMERANGE_NOW()
          AND a.action_name IN ('tokenLogin', 'mintOAuthToken', 'oidcTokenAuthorization', 'aadTokenLogin')
          AND coalesce(a.request_params['authenticationMethod'], '') <> 'API_INT_PAT_TOKEN'
          AND a.source_ip_address IS NOT NULL AND NOT a.source_ip_address RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
      ),
      firsts AS (
        SELECT f.* FROM (SELECT src_ip, actor, credential, min(event_time) AS first_use FROM auth
                         WHERE IN_TIMERANGE(event_time) GROUP BY src_ip, actor, credential) AS f
        LEFT ANTI JOIN auth AS h ON h.credential = f.credential AND h.src_ip = f.src_ip AND h.event_time < f.first_use
        LEFT ANTI JOIN platform_ips AS pi ON pi.ip = f.src_ip
      ),
      trig AS (
        SELECT t.source_ip_address AS src_ip, t.user_identity.email AS trigger_actor, t.event_time AS t, t.action_name AS how,
               coalesce(t.request_params['tokenId'], t.request_params['tokenHash']) AS revoked
        FROM {{audit_table}} AS t
        WHERE t.event_time >= TIMERANGE_NOW() - INTERVAL 2 DAYS AND t.event_time < TIMERANGE_NOW()
          AND ((t.action_name = 'getSecret' AND t.response.status_code = 200) OR t.action_name = 'revokeDbToken'
               OR (t.action_name = 'workspaceExport'
                   AND lower(coalesce(t.request_params['notebookFullPath'], '')) RLIKE
                       '([.]env([.]|$)|[.]pem$|[.]key$|credential|secrets?[.])'))
      ),
      harvest AS (
        SELECT f.first_use AS event_time, f.actor, f.src_ip, f.credential, t.how AS trigger_action,
               t.trigger_actor, t.t AS trigger_time
        FROM firsts AS f
        JOIN trig AS t ON t.src_ip = f.src_ip AND t.how <> 'revokeDbToken' AND t.trigger_actor <> f.actor
         AND t.t BETWEEN f.first_use - INTERVAL 15 MINUTES AND f.first_use
      ),
      after_revoke AS (
        SELECT min(a.event_time) AS event_time, a.actor, a.src_ip, a.credential, 'after_revokeDbToken' AS trigger_action,
               t.trigger_actor, t.t AS trigger_time
        FROM trig AS t
        JOIN auth AS u ON t.how = 'revokeDbToken' AND u.credential = t.revoked AND u.event_time < t.t
        JOIN auth AS a ON a.src_ip = u.src_ip AND a.event_time > t.t + INTERVAL 30 SECONDS
        WHERE IN_TIMERANGE(a.event_time)
        GROUP BY a.actor, a.src_ip, a.credential, t.trigger_actor, t.t
      )
      SELECT event_time, actor,
             CASE WHEN actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             src_ip, credential, trigger_action, trigger_actor, trigger_time
      FROM (SELECT * FROM harvest UNION ALL SELECT * FROM after_revoke)
output:
  summary: '{actor} credential used from {src_ip} right after {trigger_action} by {trigger_actor}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    credential: '{credential}'
    trigger_action: '{trigger_action}'
    trigger_actor: '{trigger_actor}'
    trigger_time: '{trigger_time}'
  default_context: false
runbook: |
  1. trigger_action getSecret / workspaceExport: the credential of actor was likely harvested by trigger_actor's
     session on src_ip -- rotate it and investigate trigger_actor.
  2. after_revokeDbToken: containment failed for src_ip; block it and revoke the new credential too.
annotations:
  source: cybersec-workspace-detection-app
  family: credential_pivot_same_source
