catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_command_execution_api_public_ip
description: Remote command execution through the Command Execution API (1.2) from a public IP by a principal and IP
  with no such history.
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  The Command Execution API (1.2) runs arbitrary code on an existing cluster without creating a notebook or job;
  actors use it to dump secrets in the cluster, steal instance credentials, mine on production clusters and pivot.
  Legitimate use is rare and comes from IDE plugins or legacy orchestration on stable IPs. The rule reports
  commandExecute calls in the run window from a public IP that is not Databricks platform egress, where the
  (principal, IP) pair has no commandExecute in the 30 days before. Needs verbose audit logging for the command
  text, but the call itself is logged either way. False positives: a developer's IDE plugin from a new network; a
  new orchestration host.
mitre:
- {taxonomy: Enterprise, tactic: Execution, technique_id: T1059, technique: Command and Scripting Interpreter}
- {taxonomy: Enterprise, tactic: Execution, technique_id: T1651, technique: Cloud Administration Command}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH platform_ips AS (
        SELECT DISTINCT p.source_ip_address AS ip
        FROM {{audit_table}} AS p
        WHERE IN_TIMERANGE(p.event_time)
          AND (p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')
               OR p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication'))
      ),
      ce AS (
        SELECT a.user_identity.email AS actor, a.source_ip_address AS src_ip, a.user_agent, a.event_time,
               CAST(a.workspace_id AS STRING) AS workspace_id,
               coalesce(a.request_params['cluster_id'], a.request_params['clusterId']) AS cluster_id,
               a.request_params['language'] AS language
        FROM {{audit_table}} AS a
        WHERE a.action_name = 'commandExecute'
          AND a.event_time > TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time <= TIMERANGE_NOW()
      ),
      hist AS (SELECT DISTINCT actor, src_ip FROM ce WHERE event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS)
      SELECT max(c.event_time) AS event_time,
             c.actor AS actor,
             CASE WHEN c.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             c.src_ip AS src_ip,
             max_by(c.user_agent, c.event_time) AS user_agent,
             concat_ws(', ', array_sort(collect_set(c.workspace_id))) AS workspaces,
             concat_ws(', ', slice(array_sort(collect_set(c.cluster_id)), 1, 5)) AS clusters,
             concat_ws(', ', array_sort(collect_set(c.language))) AS languages,
             count(*) AS commands,
             max(coalesce(c.user_agent, '') RLIKE '(?i)^(curl|python-requests|python-urllib|go-http-client|powershell)') AS raw_http_client,
             min(c.event_time) AS first_time
      FROM ce AS c
      LEFT ANTI JOIN hist AS h ON h.actor = c.actor AND h.src_ip = c.src_ip
      LEFT ANTI JOIN platform_ips AS pi ON pi.ip = c.src_ip
      WHERE IN_TIMERANGE(c.event_time)
        AND c.src_ip IS NOT NULL AND NOT c.src_ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
      GROUP BY c.actor, c.src_ip
output:
  summary: '{actor} ran {commands} commands through the Command Execution API from new IP {src_ip}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    user_agent: '{user_agent}'
    workspaces: '{workspaces}'
    clusters: '{clusters}'
    languages: '{languages}'
    commands: '{commands}'
    raw_http_client: '{raw_http_client}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. With verbose audit logging on, read the commands (request_params.command of commandExecute by actor).
  2. Check the clusters' instance profiles / managed identities: assume their cloud credentials were exposed.
  3. Revoke the actor's credential if the use is not explained; review what the clusters can reach.
annotations:
  source: cybersec-workspace-detection-app
  family: command_execution_api_public_ip
