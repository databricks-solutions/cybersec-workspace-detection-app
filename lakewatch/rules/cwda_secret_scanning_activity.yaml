# Generated by lakewatch/tools/build_rules.py from detect_secrets_discovery (base/detections/behavioral/secret_scanning_activity.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_secret_scanning_activity
description: Detects when someone enumerates what secrets exist in the environment by looking for principals who
  list secret scopes, secrets or ACLs and read many distinct secrets on the same day.
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: Identify potential reconnaissance activities where an attacker or malicious insider enumerates available
  secrets in the environment. This detection triggers when users list secret scopes and subsequently access a high
  number of secrets, which may indicate secret discovery or credential harvesting attempts. Maps to MITRE ATT&CK
  TA0007 - Discovery - T1526 - Cloud Service Discovery.
mitre:
- taxonomy: Enterprise
  tactic: Discovery
  technique_id: T1526
  technique: Cloud Service Discovery
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 24h
  enabled: false
timerange:
  extend_lookback: 1h
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH findings AS (
        SELECT *, CAST(event_date AS TIMESTAMP) AS event_ts
        FROM (
        SELECT
            to_date(a.event_time) AS event_date,
            a.user_identity.email AS actor,
            SUM(CASE WHEN a.action_name IN ('listScopes', 'listSecrets', 'listAcls') THEN 1 ELSE 0 END) AS scopes_enumerated,
            -- Successful reads only: listing calls carry no key (they used to add an empty ':' entry),
            -- and refused reads are not secrets obtained.
            SIZE(COLLECT_SET(CASE WHEN a.action_name = 'getSecret' AND a.response.status_code = 200
                                  THEN CONCAT(COALESCE(a.request_params['scope'], ''), ':',
                                              COALESCE(a.request_params['key'], '')) END)) AS secrets_used,
            SUM(CASE WHEN a.response.status_code <> 200 THEN 1 ELSE 0 END) AS secrets_refused,
            MAX(a.service_name) AS service_name
          FROM {{audit_table}} AS a
          -- service_name = 'secrets': Unity Catalog also emits a listSecrets action, with other request_params.
          WHERE a.service_name = 'secrets'
            AND a.action_name IN ('listScopes', 'listSecrets', 'listAcls', 'getSecret')
            AND IN_TIMERANGE(a.event_time)
          GROUP BY to_date(a.event_time), a.user_identity.email
          HAVING SUM(CASE WHEN a.action_name IN ('listScopes', 'listSecrets', 'listAcls') THEN 1 ELSE 0 END) >= 5
             AND SIZE(COLLECT_SET(CASE WHEN a.action_name = 'getSecret' AND a.response.status_code = 200
                                       THEN CONCAT(COALESCE(a.request_params['scope'], ''), ':',
                                                   COALESCE(a.request_params['key'], '')) END)) >= 5
        ) AS r
      )
      -- Allow-list: drop findings that match a row in the allow-list table (tune there, not here)
      SELECT f.* FROM findings AS f
      WHERE NOT EXISTS (
        SELECT 1 FROM {{allowlist_table}} AS al
        WHERE al.rule IN ('*', 'cwda_secret_scanning_activity')
          AND (al.expires_at IS NULL OR al.expires_at > TIMERANGE_NOW())
          AND (al.principal IS NOT NULL OR al.src_ip IS NOT NULL)
          AND (al.principal IS NULL OR al.principal = f.actor)
          AND al.src_ip IS NULL)
output:
  summary: '{actor} enumerated and read secrets'
  event_time_column: event_ts
  context:
    event_date: '{event_date}'
    actor: '{actor}'
    scopes_enumerated: '{scopes_enumerated}'
    secrets_used: '{secrets_used}'
    secrets_refused: '{secrets_refused}'
    service_name: '{service_name}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/secret_scanning_activity.py
  source_function: detect_secrets_discovery
