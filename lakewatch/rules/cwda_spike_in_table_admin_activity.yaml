# Generated by lakewatch/tools/build_rules.py from detect_admin_sql_activity_spike (base/detections/behavioral/spike_in_table_admin_activity.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_spike_in_table_admin_activity
description: Detects abnormal increases in unique admin-level queries executed by users.
severity: Low
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: Identify spikes in administrative command usage by calculating deviations from a user average query volume,
  helping detect potential misuse of privileges, compromised accounts, or scripted attacks.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 24h
  enabled: false
timerange:
  extend_lookback: 1h
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT *, CAST(event_date AS TIMESTAMP) AS event_ts
      FROM (
      SELECT
          to_date(a.event_time) AS event_date,
          a.user_identity.email AS actor,
          COUNT(*) AS commands,
          COUNT(DISTINCT a.request_params['commandText']) AS distinct_cmds,
          MAX(a.request_params['commandText']) AS sample_command
        FROM {{audit_table}} AS a
        WHERE IN_TIMERANGE(a.event_time)
          AND a.request_params['commandText'] IS NOT NULL
          AND upper(a.request_params['commandText']) NOT LIKE '%THIS IS A SYSTEM GENERATED QUERY%'
          AND (upper(a.request_params['commandText']) LIKE '%CREATE USER%'
            OR upper(a.request_params['commandText']) LIKE '%ALTER USER%'
            OR upper(a.request_params['commandText']) LIKE '%ALTER ACCOUNT%'
            OR upper(a.request_params['commandText']) LIKE '%DROP USER%'
            OR upper(a.request_params['commandText']) LIKE '%GRANT ADMIN%')
        GROUP BY to_date(a.event_time), a.user_identity.email
        HAVING COUNT(*) >= 5
      ) AS r
output:
  summary: '{commands} admin SQL statements by {actor}'
  event_time_column: event_ts
  context:
    event_date: '{event_date}'
    actor: '{actor}'
    commands: '{commands}'
    distinct_cmds: '{distinct_cmds}'
    sample_command: '{sample_command}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/spike_in_table_admin_activity.py
  source_function: detect_admin_sql_activity_spike
