# Generated by lakewatch/tools/build_rules.py from detect_data_movement_sql_queries (base/detections/behavioral/potential_data_movement_sql_queries.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_potential_data_movement_sql_queries
description: Detects SQL queries that contain COPY INTO statements with explicit credentials, which could indicate
  data exfiltration attempts using SQL commands with embedded credentials.
severity: High
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Identify potentially suspicious SQL queries that use COPY INTO commands with explicit credentials instead
  of using secure, pre-configured storage credentials. These queries could indicate attempts to exfiltrate data
  to external locations using embedded credentials in SQL statements. Maps to MITRE ATT&CK TA0010 - Exfiltration
  - T1537 - Transfer Data to Cloud Account.
mitre:
- taxonomy: Enterprise
  tactic: Exfiltration
  technique_id: T1537
  technique: Transfer Data to Cloud Account
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH findings AS (
        SELECT
            q.start_time AS start_time_ts,
            q.executed_as AS executed_as,
            q.statement_id AS statement_id,
            q.compute.warehouse_id AS warehouse_id,
            q.produced_rows AS produced_rows,
            q.total_duration_ms AS total_duration_ms,
            q.statement_text AS statement_text
          FROM system.query.history AS q
          WHERE IN_TIMERANGE(q.start_time)
            AND upper(q.statement_text) LIKE '%COPY INTO%'
            AND upper(q.statement_text) LIKE '%CREDENTIALS%'
      )
      -- Allow-list: drop findings that match a row in the allow-list table (tune there, not here)
      SELECT f.* FROM findings AS f
      WHERE NOT EXISTS (
        SELECT 1 FROM {{allowlist_table}} AS al
        WHERE al.rule IN ('*', 'cwda_potential_data_movement_sql_queries')
          AND (al.expires_at IS NULL OR al.expires_at > TIMERANGE_NOW())
          AND (al.principal IS NOT NULL OR al.src_ip IS NOT NULL)
          AND (al.principal IS NULL OR al.principal = f.executed_as)
          AND al.src_ip IS NULL)
output:
  summary: COPY INTO with inline credentials by {executed_as}
  event_time_column: start_time_ts
  context:
    start_time_ts: '{start_time_ts}'
    executed_as: '{executed_as}'
    statement_id: '{statement_id}'
    warehouse_id: '{warehouse_id}'
    produced_rows: '{produced_rows}'
    total_duration_ms: '{total_duration_ms}'
    statement_text: '{statement_text}'
    actor: '{executed_as}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/potential_data_movement_sql_queries.py
  source_function: detect_data_movement_sql_queries
