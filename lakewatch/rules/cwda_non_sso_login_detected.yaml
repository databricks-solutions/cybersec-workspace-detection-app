# Generated by lakewatch/tools/build_rules.py from detect_non_sso_login (base/detections/behavioral/non_sso_login_detected.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_non_sso_login_detected
description: Detects successful user logins that bypass SSO-based authentication methods.
severity: Low
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Identify authentication events that do not use the approved browser-based SAML SSO method, which may
  signal use of service credentials, misconfigured identity settings, or potential account compromise.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          a.action_name AS action,
          a.user_identity.email AS actor,
          a.request_params['authentication_method'] AS auth_method,
          CAST(a.workspace_id AS STRING) AS workspace_id,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.audit_level AS audit_level
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'accounts'
          AND a.action_name IN ('login', 'certLogin', 'jwtLogin', 'mfaLogin',
                                'passwordVerifyAuthentication', 'samlLogin')
          AND COALESCE(a.request_params['authentication_method'], '') <> 'BROWSER_BYO_IDP_SAML'
          AND a.response.status_code = 200
          AND IN_TIMERANGE(a.event_time)
output:
  summary: Non-SSO login ({auth_method}) by {actor}
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    action: '{action}'
    actor: '{actor}'
    auth_method: '{auth_method}'
    workspace_id: '{workspace_id}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    audit_level: '{audit_level}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/non_sso_login_detected.py
  source_function: detect_non_sso_login
