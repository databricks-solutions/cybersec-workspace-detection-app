catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_api_cluster_privileged_or_ephemeral
description: A cluster created or edited over the API with privilege-bearing configuration -- instance profiles, no
  isolation, literal storage keys -- or created and permanently deleted within the hour.
severity: High
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  Actors create their own compute to reach the cloud role behind an instance profile (then the metadata service), to
  escape Unity Catalog isolation, or to run a tool briefly and erase it. Per principal and source IP in the run
  window, over clusters create/edit by a non-browser client (the jobs service and the UI excluded), the rule reports
  at least 3 distinct instance profiles, any cluster with data_security_mode NONE, a literal storage account key in
  spark_conf, or a cluster permanently deleted within 60 minutes of its creation. Job clusters are not created this
  way and drop out by design. Instance profiles are AWS; Azure and GCP equivalents are not covered. False positives:
  Terraform or platform automation creating clusters; workspaces that still use no-isolation clusters routinely.
mitre:
- {taxonomy: Enterprise, tactic: Privilege Escalation, technique_id: T1078, technique: Valid Accounts,
   sub_technique_id: T1078.004, sub_technique: Cloud Accounts}
- {taxonomy: Enterprise, tactic: Defense Evasion, technique_id: T1578, technique: Modify Cloud Compute Infrastructure,
   sub_technique_id: T1578.002, sub_technique: Create Cloud Instance}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH c AS (
        SELECT a.user_identity.email AS actor, a.source_ip_address AS src_ip, a.user_agent, a.event_time,
               coalesce(get_json_object(a.response.result, '$.cluster_id'), a.request_params['cluster_id']) AS cluster_id,
               get_json_object(a.request_params['aws_attributes'], '$.instance_profile_arn') AS instance_profile,
               a.request_params['data_security_mode'] AS dsm,
               (coalesce(a.request_params['spark_conf'], '') RLIKE '(?i)fs[.]azure[.]account[.]key|fs[.]s3a[.]secret[.]key'
                AND NOT coalesce(a.request_params['spark_conf'], '') LIKE '%{{secrets/%') AS literal_key
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'clusters' AND a.action_name IN ('create', 'edit') AND a.response.status_code = 200
          AND IN_TIMERANGE(a.event_time)
          AND NOT coalesce(a.user_agent, '') RLIKE '(?i)armeria|^Mozilla/'
      ),
      d AS (
        SELECT x.request_params['cluster_id'] AS cluster_id, min(x.event_time) AS deleted_at
        FROM {{audit_table}} AS x
        WHERE x.service_name = 'clusters' AND x.action_name = 'permanentDelete' AND IN_TIMERANGE(x.event_time)
        GROUP BY 1
      )
      SELECT max(c.event_time) AS event_time, c.actor AS actor,
             CASE WHEN c.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             c.src_ip AS src_ip, max_by(c.user_agent, c.event_time) AS user_agent,
             count(*) AS creates,
             count(DISTINCT c.instance_profile) AS instance_profiles,
             count_if(c.dsm = 'NONE') AS no_isolation,
             count_if(c.literal_key) AS literal_keys,
             count_if(d.deleted_at <= c.event_time + INTERVAL 60 MINUTES) AS short_lived,
             concat_ws(', ', slice(array_sort(collect_set(c.cluster_id)), 1, 5)) AS clusters
      FROM c LEFT JOIN d ON d.cluster_id = c.cluster_id
      GROUP BY c.actor, c.src_ip
      HAVING count(DISTINCT c.instance_profile) >= 3 OR count_if(c.dsm = 'NONE') > 0 OR count_if(c.literal_key) > 0
          OR count_if(d.deleted_at <= c.event_time + INTERVAL 60 MINUTES) > 0
output:
  summary: '{actor} created clusters over the API from {src_ip}: {instance_profiles} instance profiles, {no_isolation} no-isolation, {literal_keys} literal keys, {short_lived} deleted within an hour'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    user_agent: '{user_agent}'
    creates: '{creates}'
    instance_profiles: '{instance_profiles}'
    no_isolation: '{no_isolation}'
    literal_keys: '{literal_keys}'
    short_lived: '{short_lived}'
    clusters: '{clusters}'
  default_context: false
runbook: |
  1. Is actor platform automation (Terraform, an internal provisioning service)? If so, exclude it.
  2. For instance profiles: review cloud activity of those roles since the cluster started.
  3. For short-lived clusters: find the commands and libraries run on them (clusterLibraries, commands).
annotations:
  source: cybersec-workspace-detection-app
  family: api_cluster_privileged_or_ephemeral
