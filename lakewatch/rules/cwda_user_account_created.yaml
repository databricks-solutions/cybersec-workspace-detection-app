# Generated by lakewatch/tools/build_rules.py from detect_user_account_created (base/detections/behavioral/user_account_created.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_user_account_created
description: Detects new user accounts created via the admin console.
severity: High
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Identify user account creation events through the admin console to detect unauthorized provisioning activity,
  potential insider threats, or abuse of administrative privileges.
mitre:
- taxonomy: Enterprise
  tactic: Persistence
  technique_id: T1098
  technique: Account Manipulation
- taxonomy: Enterprise
  tactic: Initial Access
  technique_id: T1078
  technique: Valid Accounts
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          a.user_identity.email AS actor,
          a.request_params['targetUserName'] AS target_user,
          CASE WHEN a.request_params['targetUserName'] RLIKE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
               THEN 'service_principal' ELSE 'user' END AS target_kind,
          a.request_params['endpoint'] AS endpoint,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.audit_level AS audit_level
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'accounts'
          AND a.action_name = 'add'
          AND (CAST(a.response.status_code AS INT) = 200 OR a.response.status_code IS NULL)
          AND a.request_params['endpoint'] IN ('adminConsole', 'scim', 'autoUserCreation')
          AND IN_TIMERANGE(a.event_time)
output:
  summary: '{target_kind} {target_user} created by {actor} via {endpoint}'
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    actor: '{actor}'
    target_user: '{target_user}'
    target_kind: '{target_kind}'
    endpoint: '{endpoint}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    audit_level: '{audit_level}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/user_account_created.py
  source_function: detect_user_account_created
