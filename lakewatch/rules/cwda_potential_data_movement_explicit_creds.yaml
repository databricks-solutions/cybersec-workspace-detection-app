# Generated by lakewatch/tools/build_rules.py from detect_data_movement_explicit_creds (base/detections/behavioral/potential_data_movement_explicit_creds.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_potential_data_movement_explicit_creds
description: Detects events where users execute commands that could involve explicit credentials for data movement
  operations, such as DBFS mounts, storage credential operations, or connection management.
severity: High
category: Static Signature
fidelity: FIDELITY_MEDIUM
objective: Identify potentially suspicious data movement activities where explicit credentials might be provided
  instead of using existing secure configurations. These operations could indicate data exfiltration attempts or
  unauthorized data movement to external cloud accounts. Maps to MITRE ATT&CK TA0010 - Exfiltration - T1537 - Transfer
  Data to Cloud Account.
mitre:
- taxonomy: Enterprise
  tactic: Exfiltration
  technique_id: T1537
  technique: Transfer Data to Cloud Account
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          a.service_name AS service_name,
          a.action_name AS action,
          a.response.status_code AS status_code,
          a.user_identity.email AS actor,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.request_params AS request_params
        FROM {{audit_table}} AS a
        WHERE (a.action_name IN ('mount', 'createStorageCredential', 'updateStorageCredential',
                                 'createExternalLocation', 'updateExternalLocation',
                                 'createConnection', 'updateConnection')
               OR (a.action_name = 'createCatalog' AND a.request_params['connection_name'] IS NOT NULL))
          AND IN_TIMERANGE(a.event_time)
output:
  summary: '{action} by {actor} (status {status_code})'
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    service_name: '{service_name}'
    action: '{action}'
    status_code: '{status_code}'
    actor: '{actor}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/potential_data_movement_explicit_creds.py
  source_function: detect_data_movement_explicit_creds
