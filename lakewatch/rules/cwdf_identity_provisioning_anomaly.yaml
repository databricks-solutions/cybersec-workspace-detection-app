catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_identity_provisioning_anomaly
description: An identity is provisioned or elevated outside the normal path -- auto-provisioned on a refused login, as
  an application, or from an IP new to the account, or added, re-enabled or made admin by an API client.
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  Persistence through identities. Actors with tenant-level IdP access auto-create their applications in workspaces;
  actors with an admin token add or re-enable identities. The rule reports, in the run window: just-in-time
  provisioning (accounts add, endpoint autoUserCreation) tied to a refused sign-in of the same request, whose target
  is an application (UUID) rather than a person, or from a source IP with no sign-in in the account in the 30 days
  before; and SCIM adds and updates, user reactivation, workspace or SQL entitlement changes, or admins-group adds
  made by a non-browser client. False positives: the IdP SCIM connector and Terraform (exclude their principals),
  a bulk onboarding through the API.
mitre:
- {taxonomy: Enterprise, tactic: Persistence, technique_id: T1136, technique: Create Account,
   sub_technique_id: T1136.003, sub_technique: Cloud Account}
- {taxonomy: Enterprise, tactic: Persistence, technique_id: T1098, technique: Account Manipulation}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH ev AS (
        SELECT a.event_time, a.request_id, CAST(a.workspace_id AS STRING) AS workspace_id,
               a.user_identity.email AS actor, a.source_ip_address AS src_ip, a.user_agent, a.action_name AS action,
               coalesce(a.request_params['endpoint'], '') AS endpoint,
               coalesce(a.request_params['targetUserName'], a.request_params['targetUserId']) AS target,
               a.response.status_code AS status
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'accounts' AND IN_TIMERANGE(a.event_time)
          AND ((a.action_name IN ('add', 'updateUser') AND a.request_params['endpoint'] IN ('autoUserCreation', 'scim'))
               OR a.action_name IN ('activateUser', 'changeDatabricksWorkspaceAcl', 'changeDatabricksSqlAcl')
               OR (a.action_name IN ('addPrincipalToGroup', 'addPrincipalsToGroup')
                   AND a.request_params['targetGroupName'] = 'admins'))
      ),
      refused AS (
        SELECT DISTINCT r.request_id
        FROM {{audit_table}} AS r
        WHERE r.service_name = 'accounts' AND r.action_name LIKE '%Login' AND r.response.status_code <> 200
          AND IN_TIMERANGE(r.event_time)
      ),
      seen AS (
        SELECT DISTINCT s.source_ip_address AS ip
        FROM {{audit_table}} AS s
        WHERE s.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND s.event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS
          AND s.service_name = 'accounts'
          AND s.action_name IN ('login', 'tokenLogin', 'samlLogin', 'jwtLogin', 'aadTokenLogin', 'oidcTokenAuthorization',
                                'aadBrowserLogin', 'oidcBrowserLogin', 'mintOAuthToken')
      ),
      scored AS (
        SELECT e.*,
               r.request_id IS NOT NULL AS on_refused_login,
               s.ip IS NULL AND e.src_ip IS NOT NULL AS ip_new_to_account,
               coalesce(e.target RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', false) AS target_is_app,
               size(collect_set(e.workspace_id) OVER (PARTITION BY e.target, e.endpoint)) AS target_workspaces
        FROM ev AS e
        LEFT JOIN refused AS r ON r.request_id = e.request_id
        LEFT JOIN seen AS s ON s.ip = e.src_ip
      )
      SELECT event_time, actor,
             CASE WHEN actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             src_ip, user_agent, workspace_id, action, endpoint, target,
             on_refused_login, ip_new_to_account, target_is_app, target_workspaces,
             concat_ws(', ', filter(array(
               CASE WHEN on_refused_login THEN 'refused_login' END,
               CASE WHEN endpoint = 'autoUserCreation' AND ip_new_to_account THEN 'jit_from_new_ip' END,
               CASE WHEN endpoint = 'autoUserCreation' AND target_is_app THEN 'jit_application' END,
               CASE WHEN endpoint <> 'autoUserCreation' AND NOT coalesce(user_agent, '') LIKE 'Mozilla/%' THEN 'api_client' END),
               x -> x IS NOT NULL)) AS reasons
      FROM scored
      WHERE on_refused_login
         OR (endpoint = 'autoUserCreation' AND (ip_new_to_account OR target_is_app))
         OR (endpoint <> 'autoUserCreation' AND NOT coalesce(user_agent, '') LIKE 'Mozilla/%')
output:
  summary: '{action} of {target} by {actor} via {endpoint} ({reasons})'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    user_agent: '{user_agent}'
    workspace_id: '{workspace_id}'
    action: '{action}'
    endpoint: '{endpoint}'
    target: '{target}'
    reasons: '{reasons}'
    target_workspaces: '{target_workspaces}'
  default_context: false
runbook: |
  1. Is actor the IdP provisioning connector or Terraform? If so, exclude it by name.
  2. Who is the target? An application or unknown person created by JIT provisioning is a persistence foothold.
  3. Disable the target and review what it did; check the actor's other changes in the same hour.
annotations:
  source: cybersec-workspace-detection-app
  family: identity_provisioning_anomaly
