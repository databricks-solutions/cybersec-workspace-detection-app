catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_temp_credential_vending_new_source
description: Temporary data-access credentials or download URLs issued in bulk, refused, or to a public IP and client
  new for the principal's credential vending.
severity: Medium
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  Data access outside SQL. generateTemporaryTableCredential, generateTemporaryPathCredential,
  generateTemporaryVolumeCredential, getSessionCredentials and createDownloadUrl hand the caller a short-lived cloud
  credential or presigned URL; the reads that follow go straight to cloud storage and leave no Databricks record.
  Per principal, public source IP and client family in the run window, when that combination drew no such
  credential in the 30 days before, the rule reports at least 10 credentials or URLs issued, or any refused request.
  Vending from compute IPs (clusters, warehouses) is out of scope here. False positives: a new external tool (a
  Delta reader, a notebook on a laptop) or a new network for a known one.
mitre:
- {taxonomy: Enterprise, tactic: Collection, technique_id: T1530, technique: Data from Cloud Storage}
- {taxonomy: Enterprise, tactic: Exfiltration, technique_id: T1567, technique: Exfiltration Over Web Service}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH ev AS (
        SELECT a.user_identity.email AS actor, a.source_ip_address AS src_ip, a.action_name, a.event_time,
               lower(regexp_extract(coalesce(a.user_agent, ''), '^([^/ ]+)', 1)) AS ua_family,
               a.response.status_code AS status,
               coalesce(a.request_params['table_id'], a.request_params['table_full_name'], a.request_params['volume_id'],
                        a.request_params['full_name_arg'], a.request_params['url'], a.request_params['path']) AS target
        FROM {{audit_table}} AS a
        WHERE a.action_name IN ('generateTemporaryTableCredential', 'generateTemporaryPathCredential',
                                'generateTemporaryVolumeCredential', 'getSessionCredentials', 'createDownloadUrl')
          AND a.event_time > TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time <= TIMERANGE_NOW()
          AND a.source_ip_address IS NOT NULL AND NOT a.source_ip_address RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
      ),
      seen AS (SELECT DISTINCT actor, src_ip, ua_family FROM ev WHERE event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS)
      SELECT max(e.event_time) AS event_time, e.actor AS actor,
             CASE WHEN e.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             e.src_ip AS src_ip, e.ua_family AS ua_family,
             count(*) AS issued, count(DISTINCT e.target) AS targets, count_if(e.status <> 200) AS refused,
             concat_ws(', ', array_sort(collect_set(e.action_name))) AS actions,
             min(e.event_time) AS first_time
      FROM ev AS e
      LEFT ANTI JOIN seen AS s ON s.actor = e.actor AND s.src_ip = e.src_ip AND s.ua_family = e.ua_family
      WHERE IN_TIMERANGE(e.event_time)
      GROUP BY e.actor, e.src_ip, e.ua_family
      HAVING count(*) >= 10 OR count_if(e.status <> 200) > 0
output:
  summary: '{actor} drew {issued} temporary credentials or URLs for {targets} objects from new source {src_ip} ({ua_family}); {refused} refused'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    ua_family: '{ua_family}'
    issued: '{issued}'
    targets: '{targets}'
    refused: '{refused}'
    actions: '{actions}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. Is the client a known external reader the principal uses? Who owns src_ip?
  2. The data read with these credentials is not in Databricks logs: check cloud storage access logs for src_ip.
  3. If not explained, revoke the principal's credential and review the objects listed in its vending.
annotations:
  source: cybersec-workspace-detection-app
  family: temp_credential_vending_new_source
