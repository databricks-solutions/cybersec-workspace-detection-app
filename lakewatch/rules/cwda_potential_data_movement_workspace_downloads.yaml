# Generated by lakewatch/tools/build_rules.py from detect_data_movement_downloads (base/detections/behavioral/potential_data_movement_workspace_downloads.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_potential_data_movement_workspace_downloads
description: Detects downloads from the workspace including exports, large query results, file downloads, and model
  artifacts that could indicate data exfiltration attempts.
severity: Medium
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: Identify potentially suspicious download activities that could indicate data exfiltration attempts. This
  includes large query result downloads, workspace exports (all formats), file downloads, MLflow artifact/trace
  reads and model version downloads, aggregated per principal, source IP and hour. These activities may indicate
  unauthorized data movement or intellectual property theft. Maps to MITRE ATT&CK TA0010 - Exfiltration - T1567
  - Exfiltration Over Web Service.
mitre:
- taxonomy: Enterprise
  tactic: Exfiltration
  technique_id: T1567
  technique: Exfiltration Over Web Service
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 24h
  enabled: false
timerange:
  extend_lookback: 1h
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT *
      FROM (
      SELECT
          to_date(a.event_time) AS event_date,
          a.user_identity.email AS actor,
          a.action_name AS action,
          COUNT(*) AS downloads,
          COUNT(DISTINCT COALESCE(a.request_params['notebookFullPath'], a.request_params['path'],
                                  a.request_params['filePath'], a.request_params['artifactLocation'],
                                  a.request_params['request_id'],
                                  CONCAT(a.request_params['model_name'], '/', a.request_params['version']),
                                  a.event_id)) AS distinct_objects,
          COUNT(DISTINCT CASE
            WHEN lower(regexp_extract(COALESCE(a.request_params['notebookFullPath'], a.request_params['path'], ''),
                                      '^(/Workspace)?/(Users|Repos)/([^/]+)', 3)) NOT IN ('', lower(a.user_identity.email))
            THEN regexp_extract(COALESCE(a.request_params['notebookFullPath'], a.request_params['path'], ''),
                                '^(/Workspace)?/(Users|Repos)/([^/]+)', 3) END) AS foreign_homes,
          CONCAT_WS(', ', COLLECT_SET(a.request_params['workspaceExportFormat'])) AS export_formats,
          COUNT(DISTINCT a.source_ip_address) AS distinct_ips,
          CONCAT_WS(', ', COLLECT_SET(a.source_ip_address)) AS source_ips,
          CONCAT_WS(', ', COLLECT_SET(a.user_agent)) AS user_agents,
          MIN(a.event_time) AS first_seen,
          MAX(a.event_time) AS last_seen
        FROM {{audit_table}} AS a
        WHERE IN_TIMERANGE(a.event_time)
          AND (
            a.action_name IN ('downloadPreviewResults', 'downloadLargeResults', 'filesGet', 'createDownloadUrl',
                              'getModelVersionDownloadUri', 'getModelVersionSignedDownloadUri',
                              'readArtifact', 'readTraceData', 'workspaceExport')
            OR (a.action_name = 'downloadQueryResult'
                AND COALESCE(a.request_params['fileType'], '') <> 'arrows')
            OR (a.action_name = 'generateTemporaryModelVersionCredential'
                AND a.request_params['operation'] = 'READ_MODEL_VERSION')
          )
        GROUP BY to_date(a.event_time), a.user_identity.email, a.action_name
      ) AS r
      WHERE foreign_homes >= 3 OR distinct_objects >= 200
output:
  summary: '{actor}: {distinct_objects} objects via {action} ({foreign_homes} other users'' homes)'
  event_time_column: last_seen
  context:
    event_date: '{event_date}'
    actor: '{actor}'
    action: '{action}'
    downloads: '{downloads}'
    distinct_objects: '{distinct_objects}'
    foreign_homes: '{foreign_homes}'
    export_formats: '{export_formats}'
    distinct_ips: '{distinct_ips}'
    source_ips: '{source_ips}'
    user_agents: '{user_agents}'
    first_seen: '{first_seen}'
    last_seen: '{last_seen}'
    src_ip: '{source_ips}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/potential_data_movement_workspace_downloads.py
  source_function: detect_data_movement_downloads
