# Generated by lakewatch/tools/build_rules.py from detect_config_changes_account_level (base/detections/event-based/configuration_changes_account_level.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_configuration_changes_account_level
description: Detects when users modify account-level settings, which could indicate privilege escalation attempts
  or unauthorized administrative changes to tenant-wide configurations.
severity: Low
category: Static Signature
fidelity: FIDELITY_INVESTIGATIVE
objective: Identify potentially suspicious account-level configuration changes that could affect the entire Databricks
  tenant. These modifications might indicate attempts to escalate privileges, weaken security controls, or establish
  persistence at the tenant level. Maps to MITRE ATT&CK TA0004 - Privilege Escalation - T1484 - Domain or Tenant
  Policy Modification.
mitre:
- taxonomy: Enterprise
  tactic: Privilege Escalation
  technique_id: T1484
  technique: Domain or Tenant Policy Modification
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          a.service_name AS service_name,
          a.action_name AS action,
          CASE WHEN a.request_params['settingTypeName'] IN ('acct_ip_acl_rule', 'acct_ip_acl_enable', 'network_policy', 'network_policy_binding') THEN 'High' ELSE 'Informational' END AS severity,
          a.request_params['settingName'] AS setting_name,
          a.request_params['settingKeyName'] AS setting_key,
          a.request_params['settingValueForAudit'] AS new_value,
          a.request_params['settingTypeName'] AS setting_type,
          a.user_identity.email AS actor,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.request_params AS request_params
        FROM {{audit_table}} AS a
        WHERE a.audit_level = 'ACCOUNT_LEVEL'
          AND a.action_name IN ('setSetting', 'deleteSetting')
          AND IN_TIMERANGE(a.event_time)
output:
  summary: '{action} {setting_type} by {actor} ({severity})'
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    service_name: '{service_name}'
    action: '{action}'
    severity: '{severity}'
    setting_name: '{setting_name}'
    setting_key: '{setting_key}'
    new_value: '{new_value}'
    setting_type: '{setting_type}'
    actor: '{actor}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/event-based/configuration_changes_account_level.py
  source_function: detect_config_changes_account_level
