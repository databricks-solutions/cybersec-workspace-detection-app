catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_anomalous_credential_minting
description: A credential is minted anomalously -- a PAT or service principal secret from a creator IP new for the
  creator, a service principal minting its own PAT from a script, a token with no or very long expiry, or a PAT first
  used from a different IP new to the account within 72 hours of being minted.
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  Persistence and session-to-token pivots. In the run window the rule reports: generateDbToken or
  servicePrincipalCredentials create from an IP the creator did not use in the 30 days before (Terraform excluded);
  a service principal minting its own PAT with a non-SDK client; a PAT with no expiry or a lifetime above 90 days;
  and an external PAT whose use in the window comes from an IP with no sign-in in the account in the 30 days before,
  when that PAT was minted from a different IP in the 72 hours before the use (tokenHash of generateDbToken equals
  tokenId of tokenLogin). False positives: a user who mints in the browser and pastes the token into CI or a SaaS
  connector; a creator travelling.
mitre:
- {taxonomy: Enterprise, tactic: Persistence, technique_id: T1098, technique: Account Manipulation,
   sub_technique_id: T1098.001, sub_technique: Additional Cloud Credentials}
- {taxonomy: Enterprise, tactic: Defense Evasion, technique_id: T1550, technique: Use Alternate Authentication Material,
   sub_technique_id: T1550.001, sub_technique: Application Access Token}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH mint AS (
        SELECT a.event_time, a.user_identity.email AS creator, a.source_ip_address AS src_ip, a.user_agent, a.action_name,
               coalesce(a.request_params['tokenHash'], a.request_params['service_principal']) AS minted,
               CASE WHEN a.action_name <> 'generateDbToken' THEN NULL
                    WHEN coalesce(CAST(a.request_params['tokenExpirationTime'] AS BIGINT), 0) <= 0 THEN 99999.0
                    ELSE round((CAST(a.request_params['tokenExpirationTime'] AS BIGINT) / 1000 - unix_timestamp(a.event_time)) / 86400, 2)
               END AS lifetime_days
        FROM {{audit_table}} AS a
        WHERE a.response.status_code = 200
          AND a.event_time >= TIMERANGE_NOW() - INTERVAL 4 DAYS AND a.event_time < TIMERANGE_NOW()
          AND ((a.service_name = 'accounts' AND a.action_name = 'generateDbToken')
               OR (a.service_name = 'servicePrincipalCredentials' AND a.action_name = 'create'))
      ),
      signins AS (
        SELECT s.user_identity.email AS who, s.source_ip_address AS ip, s.event_time
        FROM {{audit_table}} AS s
        WHERE s.service_name = 'accounts'
          AND s.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND s.event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS
      ),
      window_mints AS (
        SELECT m.*, si.who IS NULL AS creator_ip_new
        FROM mint AS m
        LEFT JOIN (SELECT DISTINCT who, ip FROM signins) AS si ON si.who = m.creator AND si.ip = m.src_ip
        WHERE IN_TIMERANGE(m.event_time)
      ),
      mint_findings AS (
        SELECT event_time, creator AS actor, src_ip, user_agent, action_name AS action, lifetime_days,
               creator_ip_new, CAST(NULL AS STRING) AS used_from,
               concat_ws(', ', filter(array(
                 CASE WHEN lifetime_days > 90 THEN 'long_or_no_expiry' END,
                 CASE WHEN creator_ip_new AND NOT coalesce(user_agent, '') RLIKE '(?i)databricks-tf-provider|terraform'
                      THEN 'creator_ip_new' END,
                 CASE WHEN action_name = 'generateDbToken' AND creator RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                       AND NOT coalesce(user_agent, '') RLIKE '(?i)databricks-tf-provider|databricks-sdk|databricks-cli'
                      THEN 'sp_self_mint_script' END), x -> x IS NOT NULL)) AS reasons
        FROM window_mints
      ),
      uses AS (
        SELECT u.request_params['tokenId'] AS tok, u.source_ip_address AS ip, u.user_identity.email AS who,
               min(u.event_time) AS first_use, count(*) AS logins, max_by(u.user_agent, u.event_time) AS user_agent
        FROM {{audit_table}} AS u
        WHERE u.action_name = 'tokenLogin' AND u.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN'
          AND u.response.status_code = 200 AND IN_TIMERANGE(u.event_time)
        GROUP BY 1, 2, 3
      ),
      use_findings AS (
        SELECT u.first_use AS event_time, u.who AS actor, u.ip AS src_ip, u.user_agent, 'tokenLogin' AS action,
               m.lifetime_days, CAST(NULL AS BOOLEAN) AS creator_ip_new, m.src_ip AS used_from,
               'minted_then_used_from_new_ip' AS reasons
        FROM uses AS u
        JOIN mint AS m ON m.minted = u.tok AND m.action_name = 'generateDbToken'
         AND m.src_ip <> u.ip AND u.first_use BETWEEN m.event_time AND m.event_time + INTERVAL 72 HOURS
        LEFT ANTI JOIN (SELECT DISTINCT ip FROM signins) AS known ON known.ip = u.ip
      )
      SELECT event_time, actor,
             CASE WHEN actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             src_ip, user_agent, action, lifetime_days, creator_ip_new, used_from, reasons
      FROM (SELECT * FROM mint_findings UNION ALL SELECT * FROM use_findings)
      WHERE reasons <> ''
output:
  summary: '{action} by {actor} from {src_ip}: {reasons}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    user_agent: '{user_agent}'
    action: '{action}'
    lifetime_days: '{lifetime_days}'
    creator_ip_new: '{creator_ip_new}'
    minted_from: '{used_from}'
    reasons: '{reasons}'
  default_context: false
runbook: |
  1. Ask the creator whether they minted the credential, and where it is used.
  2. minted_then_used_from_new_ip: the token was minted from minted_from and used from src_ip; is src_ip theirs?
  3. Revoke the token or delete the service principal secret if not explained; check what it did.
annotations:
  source: cybersec-workspace-detection-app
  family: anomalous_credential_minting
