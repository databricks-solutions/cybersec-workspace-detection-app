catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_secret_scope_enumeration
description: Secret scope enumeration -- keys listed across many scopes, refusals across scopes, scopes listed in
  several workspaces, or a principal enumerating secrets for the first time from a public IP.
severity: Medium
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  Discovery before secret theft. An attacker with a fresh credential does not know which scopes it can read, so it
  walks every scope and collects ACL refusals; an owner's job reads the few keys it needs and rarely lists. Per
  principal and source IP in the run window the rule reports any of: keys listed (listSecrets) in at least 10
  distinct scopes; refusals (status other than 200 on listSecrets, getSecret or listAcls) in at least 5 distinct
  scopes; listScopes calls in at least 3 workspaces; or a principal with no listScopes/listSecrets in the 32 days
  before that enumerates from a public IP. Fires without any successful read. False positives: secret-inventory
  and security tooling (add them to the allow-list table), a new admin exploring scopes.
mitre:
- {taxonomy: Enterprise, tactic: Discovery, technique_id: T1526, technique: Cloud Service Discovery}
- {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1555, technique: Credentials from Password Stores}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH w AS (
        SELECT a.user_identity.email AS actor, a.source_ip_address AS src_ip,
               count_if(a.action_name = 'listScopes') AS list_scopes,
               count(DISTINCT CASE WHEN a.action_name = 'listSecrets'
                                   THEN concat_ws(':', a.workspace_id, a.request_params['scope']) END) AS scopes_listed,
               count(DISTINCT CASE WHEN a.response.status_code <> 200
                                   THEN concat_ws(':', a.workspace_id, a.request_params['scope']) END) AS scopes_refused,
               count(DISTINCT CASE WHEN a.action_name IN ('listScopes', 'listSecrets') THEN a.workspace_id END) AS workspaces,
               min(a.event_time) AS first_time, max(a.event_time) AS event_time
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'secrets' AND a.action_name IN ('listScopes', 'listSecrets', 'getSecret', 'listAcls')
          AND IN_TIMERANGE(a.event_time)
          AND a.user_identity.email IS NOT NULL
        GROUP BY a.user_identity.email, a.source_ip_address
      ),
      hist AS (
        SELECT DISTINCT h.user_identity.email AS actor
        FROM {{audit_table}} AS h
        WHERE h.service_name = 'secrets' AND h.action_name IN ('listScopes', 'listSecrets')
          AND h.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND h.event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS
      ),
      findings AS (
        SELECT w.event_time AS event_time,
               w.actor AS actor,
               CASE WHEN w.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                    THEN 'sp' ELSE 'user' END AS actor_kind,
               w.src_ip AS src_ip,
               w.list_scopes AS list_scopes,
               w.scopes_listed AS scopes_listed,
               w.scopes_refused AS scopes_refused,
               w.workspaces AS workspaces,
               h.actor IS NULL AS first_time_enumerator,
               w.first_time AS first_time,
               concat_ws(', ', filter(array(
                 CASE WHEN w.scopes_listed >= 10 THEN 'breadth' END,
                 CASE WHEN w.scopes_refused >= 5 THEN 'refusals' END,
                 CASE WHEN w.list_scopes > 0 AND w.workspaces >= 3 THEN 'multi_workspace' END,
                 CASE WHEN h.actor IS NULL AND w.list_scopes + w.scopes_listed > 0
                           AND w.src_ip IS NOT NULL AND NOT w.src_ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])' THEN 'first_time' END), x -> x IS NOT NULL)) AS reasons
        FROM w LEFT JOIN hist AS h ON h.actor = w.actor
        WHERE w.scopes_listed >= 10
           OR w.scopes_refused >= 5
           OR (w.list_scopes > 0 AND w.workspaces >= 3)
           OR (h.actor IS NULL AND w.list_scopes + w.scopes_listed > 0
               AND w.src_ip IS NOT NULL AND NOT w.src_ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])')
      )
      -- Allow-list: drop findings that match a row in the allow-list table (tune there, not here)
      SELECT f.* FROM findings AS f
      WHERE NOT EXISTS (
        SELECT 1 FROM {{allowlist_table}} AS al
        WHERE al.rule IN ('*', 'cwdf_secret_scope_enumeration')
          AND (al.expires_at IS NULL OR al.expires_at > TIMERANGE_NOW())
          AND (al.principal IS NOT NULL OR al.src_ip IS NOT NULL)
          AND (al.principal IS NULL OR al.principal = f.actor)
          AND (al.src_ip IS NULL OR al.src_ip = f.src_ip))
output:
  summary: '{actor} enumerated secrets from {src_ip}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    list_scopes: '{list_scopes}'
    scopes_listed: '{scopes_listed}'
    scopes_refused: '{scopes_refused}'
    workspaces: '{workspaces}'
    first_time_enumerator: '{first_time_enumerator}'
    reasons: '{reasons}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. Is the principal secret-inventory or security tooling? If so, exclude it.
  2. Did any successful getSecret follow (cwdf_secret_bulk_read_burst, cwda_secret_scanning_activity)?
  3. Check how the principal authenticated from src_ip (cwdf_credential_new_network_and_client).
annotations:
  source: cybersec-workspace-detection-app
  family: secret_scope_enumeration_breadth_or_refusals
