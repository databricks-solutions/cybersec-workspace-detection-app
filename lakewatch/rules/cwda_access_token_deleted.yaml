# Generated by lakewatch/tools/build_rules.py from detect_access_token_deleted (base/detections/behavioral/access_token_deleted.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_access_token_deleted
description: Detects access tokens being revoked via the accounts service.
severity: Low
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Monitor for explicit revocation of access tokens to track potentially suspicious cleanup activity, such
  as unauthorized credential invalidation or the concealment of prior access.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
          a.user_identity.email AS actor,
          a.request_params['tokenHash'] AS token_hash,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.audit_level AS audit_level
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'accounts'
          AND a.action_name = 'revokeDbToken'
          AND IN_TIMERANGE(a.event_time)
output:
  summary: Access token deleted by {actor}
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    status: '{status}'
    actor: '{actor}'
    token_hash: '{token_hash}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    audit_level: '{audit_level}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/access_token_deleted.py
  source_function: detect_access_token_deleted
