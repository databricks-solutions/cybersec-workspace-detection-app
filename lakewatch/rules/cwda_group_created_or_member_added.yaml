# Generated by lakewatch/tools/build_rules.py from detect_group_changes (base/detections/behavioral/principal_added_to_group.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_group_created_or_member_added
description: Detects the addition of a user or service principal to a group.
severity: Low
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Monitor group membership assignments to detect unauthorized privilege escalation or role provisioning,
  which may signal insider misuse or preparatory steps in a broader attack.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT *
      FROM (
      SELECT
          a.event_time AS event_time,
          a.action_name AS action,
          CASE WHEN a.action_name IN ('createGroup','removeGroup')
               THEN 'GROUP_LIFECYCLE' ELSE 'MEMBERSHIP' END AS change_kind,
          CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
          a.user_identity.email AS actor,
          COALESCE(a.request_params['targetGroupName'],
                   a.request_params['target_group_name'],
                   a.request_params['targetGroupId']) AS group_name,
          COALESCE(a.request_params['targetUserName'],
                   a.request_params['target_user_name'],
                   a.request_params['principals']) AS target_user,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.audit_level AS audit_level,
          a.request_params AS request_params
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'accounts'
          AND a.action_name IN ('createGroup', 'removeGroup', 'addPrincipalToGroup',
                                'addPrincipalsToGroup', 'removePrincipalFromGroup')
          AND IN_TIMERANGE(a.event_time)
      ) AS r
      WHERE action IN ('createGroup', 'addPrincipalToGroup', 'addPrincipalsToGroup')
output:
  summary: Group change {action} on {group_name} by {actor}
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    action: '{action}'
    change_kind: '{change_kind}'
    status: '{status}'
    actor: '{actor}'
    group_name: '{group_name}'
    target_user: '{target_user}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    audit_level: '{audit_level}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/principal_added_to_group.py
  source_function: detect_group_changes
