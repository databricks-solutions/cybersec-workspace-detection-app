# Generated by lakewatch/tools/build_rules.py from detect_user_password_changed (base/detections/behavioral/user_password_changed.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_user_password_changed
description: Detects password change events performed through the accounts service.
severity: Low
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Track password changes across user accounts to identify potentially unauthorized credential resets, which
  could indicate account takeover attempts, insider misuse, or lateral movement within the environment.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
          a.user_identity.email AS actor,
          a.request_params['targetUserId'] AS target_user,
          a.request_params['newPasswordSource'] AS password_source,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.audit_level AS audit_level
        FROM {{audit_table}} AS a
        WHERE a.service_name = 'accounts'
          AND a.action_name = 'changePassword'
          AND IN_TIMERANGE(a.event_time)
output:
  summary: Password of {target_user} changed by {actor}
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    status: '{status}'
    actor: '{actor}'
    target_user: '{target_user}'
    password_source: '{password_source}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    audit_level: '{audit_level}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/user_password_changed.py
  source_function: detect_user_password_changed
