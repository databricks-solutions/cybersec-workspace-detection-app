# Generated by lakewatch/tools/build_rules.py from detect_token_scanning_activity (base/detections/behavioral/token_scanning_activity.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_token_scanning_activity
description: Detects anomalously low activity from API tokens across multiple IP addresses.
severity: Low
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: Identify suspicious low-usage patterns of API tokens (PATs, Entra ID and Databricks OAuth tokens) across
  varying IPs or user agents, which may indicate brute-force attempts to scan for valid tokens or abuse of leaked
  credentials. API connectivity using a token for scanning appears as a single login event, - with no further actions..
  Look for a comparatively low number per src_ip. (1 event is registered per connection attempt, whereas a genuine
  connection (auth'd) will have potentially 100's of entries)
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 24h
  enabled: false
timerange:
  extend_lookback: 1h
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          COALESCE(a.request_params['tokenId'], a.request_params['client_id'],
                   CONCAT(a.request_params['authenticationMethod'], ':', a.user_identity.email)) AS token_id,
          MAX(a.request_params['authenticationMethod']) AS credential_type,
          COUNT(DISTINCT regexp_replace(a.source_ip_address, ':[0-9]+$', '')) AS distinct_ips,
          CONCAT_WS(', ', COLLECT_SET(regexp_replace(a.source_ip_address, ':[0-9]+$', ''))) AS source_ips,
          MIN(a.event_time) AS first_seen,
          MAX(a.event_time) AS last_seen,
          COUNT(*) AS attempts,
          CONCAT_WS(', ', COLLECT_SET(a.user_identity.email)) AS actors,
          CONCAT_WS(', ', COLLECT_SET(a.user_agent)) AS user_agents
        FROM {{audit_table}} AS a
        LEFT ANTI JOIN (
          -- Platform egress: IPs that also carry Databricks-internal authentication in the
          -- window (cluster-internal PATs, in-house OAuth clients used by Apps/serverless).
          SELECT DISTINCT regexp_replace(p.source_ip_address, ':[0-9]+$', '') AS ip
          FROM {{audit_table}} AS p
          WHERE IN_TIMERANGE(p.event_time)
            AND (p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')
                 OR p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication'))
        ) AS platform ON regexp_replace(a.source_ip_address, ':[0-9]+$', '') = platform.ip
        WHERE a.request_params['authenticationMethod'] IN ('API_EXT_PAT_TOKEN', 'API_AAD_OAUTH_TOKEN', 'API_OIDC_TOKEN')
          AND IN_TIMERANGE(a.event_time)
        GROUP BY COALESCE(a.request_params['tokenId'], a.request_params['client_id'],
                          CONCAT(a.request_params['authenticationMethod'], ':', a.user_identity.email))
        HAVING COUNT(DISTINCT regexp_replace(a.source_ip_address, ':[0-9]+$', '')) > 1
output:
  summary: '{credential_type} token used from {distinct_ips} IPs'
  event_time_column: last_seen
  context:
    token_id: '{token_id}'
    credential_type: '{credential_type}'
    distinct_ips: '{distinct_ips}'
    source_ips: '{source_ips}'
    first_seen: '{first_seen}'
    last_seen: '{last_seen}'
    attempts: '{attempts}'
    actors: '{actors}'
    user_agents: '{user_agents}'
    actor: '{actors}'
    src_ip: '{source_ips}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/token_scanning_activity.py
  source_function: detect_token_scanning_activity
