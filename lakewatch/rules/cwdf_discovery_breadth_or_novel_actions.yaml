catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_discovery_breadth_or_novel_actions
description: One principal suddenly surveys many surfaces -- several discovery families from a new source IP, or
  several discovery actions it has never performed.
severity: Medium
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  Reconnaissance after a credential is taken. An attacker with a new credential surveys every surface in minutes
  (secrets, storage credentials and external locations, connections, Unity Catalog metadata, Delta Sharing, query
  history and run output, repos and git credentials, workspace export); a person or pipeline uses a narrow,
  repeating set. Per principal and source IP in the run window the rule reports either at least 3 discovery families
  from a public IP the principal did not sign in from in the 30 days before, or -- for service principals and
  non-browser clients -- at least 3 discovery actions the principal never performed in the 30 days before.
  Principals younger than 7 days are skipped (everything is new to them). Most read-only listing (users, clusters,
  jobs) leaves no audit row, so the breadth here understates what an actor did. False positives: a new admin or
  platform engineer, a newly granted service principal on its first real run, security tooling.
mitre:
- {taxonomy: Enterprise, tactic: Discovery, technique_id: T1526, technique: Cloud Service Discovery}
- {taxonomy: Enterprise, tactic: Discovery, technique_id: T1619, technique: Cloud Storage Object Discovery}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH ev AS (
        SELECT a.user_identity.email AS actor, a.source_ip_address AS src_ip, a.service_name, a.action_name,
               a.event_time, a.user_agent,
               CASE WHEN a.action_name IN ('listScopes', 'listSecrets', 'getSecret', 'listAcls') THEN 'secrets'
                    WHEN a.action_name IN ('listStorageCredentials', 'getStorageCredential', 'listExternalLocations',
                                           'listConnections', 'getConnection', 'listCredentials') THEN 'storage_and_connections'
                    WHEN a.action_name IN ('listCatalogs', 'listSchemas', 'listMetastores', 'getMetastoreSummary',
                                           'listEffectivePrivilegeAssignments', 'getInformationSchema') THEN 'uc_metadata'
                    WHEN a.action_name IN ('listShares', 'listProviders', 'listRecipients') THEN 'sharing'
                    WHEN a.action_name IN ('listHistoryQueries', 'getRunOutput') THEN 'history_and_output'
                    WHEN a.action_name IN ('listRepos', 'listGitCredentials') THEN 'repos'
                    WHEN a.action_name = 'workspaceExport' THEN 'export' END AS family
        FROM {{audit_table}} AS a
        WHERE a.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time < TIMERANGE_NOW()
          AND a.user_identity.email IS NOT NULL AND a.user_identity.email <> 'System-User'
          AND a.action_name IN ('listScopes', 'listSecrets', 'getSecret', 'listAcls', 'listStorageCredentials',
                                'getStorageCredential', 'listExternalLocations', 'listConnections', 'getConnection',
                                'listCredentials', 'listCatalogs', 'listSchemas', 'listMetastores', 'getMetastoreSummary',
                                'listEffectivePrivilegeAssignments', 'getInformationSchema', 'listShares', 'listProviders',
                                'listRecipients', 'listHistoryQueries', 'getRunOutput', 'listRepos', 'listGitCredentials',
                                'workspaceExport')
      ),
      win AS (SELECT * FROM ev WHERE IN_TIMERANGE(event_time)),
      actors AS (SELECT DISTINCT actor FROM win),
      sign_in_ips AS (
        SELECT DISTINCT l.user_identity.email AS actor, l.source_ip_address AS src_ip
        FROM {{audit_table}} AS l
        WHERE l.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND l.event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS
          AND l.user_identity.email IN (SELECT actor FROM actors)
          AND l.action_name IN ('login', 'tokenLogin', 'samlLogin', 'jwtLogin', 'aadTokenLogin', 'oidcTokenAuthorization',
                                'aadBrowserLogin', 'oidcBrowserLogin', 'mintOAuthToken')
      ),
      old_enough AS (
        SELECT actor FROM ev WHERE event_time < TIMERANGE_NOW() - INTERVAL 7 DAYS GROUP BY actor
        UNION
        SELECT actor FROM sign_in_ips
      ),
      base_act AS (
        SELECT DISTINCT actor, service_name, action_name FROM ev
        WHERE event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS
      ),
      scored AS (
        SELECT w.actor, w.src_ip,
               count(DISTINCT w.family) AS families,
               count(DISTINCT CASE WHEN ba.action_name IS NULL THEN w.service_name || '/' || w.action_name END) AS new_action_types,
               max(si.src_ip IS NULL AND w.src_ip IS NOT NULL AND NOT w.src_ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])') AS new_ip,
               max(NOT coalesce(w.user_agent, '') RLIKE '^Mozilla/') AS non_browser,
               concat_ws(', ', slice(array_sort(collect_set(w.action_name)), 1, 15)) AS actions,
               concat_ws(', ', array_sort(collect_set(w.family))) AS families_list,
               min(w.event_time) AS first_time, max(w.event_time) AS event_time
        FROM win AS w
        JOIN old_enough AS o ON o.actor = w.actor
        LEFT JOIN base_act AS ba ON ba.actor = w.actor AND ba.service_name = w.service_name AND ba.action_name = w.action_name
        LEFT JOIN (SELECT DISTINCT actor, src_ip FROM sign_in_ips) AS si ON si.actor = w.actor AND si.src_ip = w.src_ip
        GROUP BY w.actor, w.src_ip
      )
      SELECT event_time,
             actor,
             CASE WHEN actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             src_ip,
             families,
             families_list,
             new_action_types,
             new_ip,
             actions,
             first_time
      FROM scored
      WHERE (families >= 3 AND new_ip)
         OR (new_action_types >= 3 AND (actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' OR non_browser))
output:
  summary: '{actor} surveyed {families} discovery families ({families_list}) from {src_ip}; {new_action_types} new action types'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    families: '{families}'
    families_list: '{families_list}'
    new_action_types: '{new_action_types}'
    new_ip: '{new_ip}'
    actions: '{actions}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. Who is the principal and is the change in behaviour explained (new role, new pipeline, security tooling)?
  2. If new_ip is true, check how it signed in from src_ip (cwdf_credential_new_network_and_client).
  3. Look for collection right after: secret reads, exports, downloads by the same principal.
annotations:
  source: cybersec-workspace-detection-app
  family: discovery_breadth_or_novel_actions
