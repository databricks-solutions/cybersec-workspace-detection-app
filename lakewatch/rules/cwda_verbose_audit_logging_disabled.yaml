# Generated by lakewatch/tools/build_rules.py from detect_verbose_audit_logging_disabled (base/detections/event-based/verbose_audit_logging_disabled.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_verbose_audit_logging_disabled
description: Detects when verbose audit logging is explicitly disabled at the workspace configuration level.
severity: Low
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Monitor configuration changes that disable verbose audit logs to detect attempts at reducing system visibility,
  which may signal attacker evasion, insider threat activity, or unauthorized configuration tampering.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT *
      FROM (
      SELECT
          a.event_time AS event_time,
          try_element_at(filter(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key = 'enableVerboseAuditLogs'), 1).value AS set_to,
          CASE WHEN lower(COALESCE(try_element_at(filter(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key = 'enableVerboseAuditLogs'), 1).value, '')) = 'false'
               THEN 'CRITICAL - audit logging disabled, visibility gap starts here'
               ELSE 'INFO - audit logging enabled' END AS severity,
          CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
          a.user_identity.email AS actor,
          CAST(a.workspace_id AS STRING) AS workspace_id,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent
        FROM {{audit_table}} AS a
        WHERE a.action_name = 'workspaceConfEdit'
          -- Keys and values are comma-joined in matching positions when one request changes
          -- several settings; match the key anywhere in the list, not the whole string.
          AND exists(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key = 'enableVerboseAuditLogs')
          AND IN_TIMERANGE(a.event_time)
      ) AS r
      WHERE lower(set_to) = 'false'
output:
  summary: Verbose audit logging disabled by {actor}
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    set_to: '{set_to}'
    severity: '{severity}'
    status: '{status}'
    actor: '{actor}'
    workspace_id: '{workspace_id}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/event-based/verbose_audit_logging_disabled.py
  source_function: detect_verbose_audit_logging_disabled
