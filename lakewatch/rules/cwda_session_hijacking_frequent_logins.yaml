# Generated by lakewatch/tools/build_rules.py from detect_session_multi_ip_logins (base/detections/behavioral/session_hijacking_frequent_logins.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_session_hijacking_frequent_logins
description: Detects a high volume of login events from different public IPs and user agents in a short time window.
severity: Low
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: Identify burst login activity that may indicate session hijacking or automated attempts to reuse stolen
  credentials, by tracking users logging in from multiple IPs with unusual frequency over a short duration.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 24h
  enabled: false
timerange:
  extend_lookback: 1h
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.user_identity.email AS actor,
          COUNT(DISTINCT a.source_ip_address) AS distinct_ips,
          COUNT(*) AS logins,
          CONCAT_WS(', ', COLLECT_SET(a.source_ip_address)) AS source_ips,
          CONCAT_WS(', ', COLLECT_SET(a.user_agent)) AS user_agents,
          MIN(a.event_time) AS first_seen,
          MAX(a.event_time) AS last_seen
        FROM {{audit_table}} AS a
        WHERE IN_TIMERANGE(a.event_time)
          AND a.service_name = 'accounts'
          -- Entra (aad*) and OAuth (oidc*, mintOAuthToken) logins are how service principals and
          -- Entra tokens authenticate; without them those identities were invisible.
          AND a.action_name IN ('login', 'tokenLogin', 'samlLogin', 'jwtLogin', 'aadTokenLogin', 'oidcTokenAuthorization',
                                'aadBrowserLogin', 'oidcBrowserLogin', 'mintOAuthToken')
          AND a.user_identity.email IS NOT NULL
          -- RFC 1918, CGNAT / Databricks-internal (100.64.0.0/10), loopback, link-local, IPv6 unique-local.
          AND NOT a.source_ip_address RLIKE
              '^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.|127\\.|169\\.254\\.|(?i)f[cd][0-9a-f]{2}:)'
          -- Databricks-internal service clients only, case-sensitive. A bare 'databricks' (and lower())
          -- used to drop databricks-cli, databricks-sdk-* and the SQL connectors -- an actor's own tooling.
          AND NOT COALESCE(a.user_agent, '') RLIKE
              'Databricks-Service/driver|Databricks-Runtime|Delta-Sharing-SparkStructuredStreaming|RawDBHttpClient|wsfs/|mlflow-python|feature-store|dbr:'
        GROUP BY a.user_identity.email
        HAVING COUNT(DISTINCT a.source_ip_address) >= 5
output:
  summary: '{actor} logged in from {distinct_ips} public IPs'
  event_time_column: last_seen
  context:
    actor: '{actor}'
    distinct_ips: '{distinct_ips}'
    logins: '{logins}'
    source_ips: '{source_ips}'
    user_agents: '{user_agents}'
    first_seen: '{first_seen}'
    last_seen: '{last_seen}'
    src_ip: '{source_ips}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/session_hijacking_frequent_logins.py
  source_function: detect_session_multi_ip_logins
