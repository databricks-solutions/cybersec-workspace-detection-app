# Generated by lakewatch/tools/build_rules.py from detect_config_changes_high_priority (base/detections/event-based/configuration_changes_high_priority.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_configuration_changes_high_priority
description: Detects high-priority configuration changes including verbose audit logging modifications, IP access
  list changes, and customer-approved workspace login configuration updates that could impact security posture.
severity: Medium
category: Static Signature
fidelity: FIDELITY_HIGH
objective: Monitor critical configuration changes that could weaken security controls, modify access policies, or
  reduce system visibility. This includes verbose audit logging being disabled, IP access list modifications, and
  customer-approved workspace login configuration changes which may signal attacker evasion, insider threat activity,
  or unauthorized configuration tampering.
mitre:
- taxonomy: Enterprise
  tactic: Privilege Escalation
  technique_id: T1484
  technique: Domain or Tenant Policy Modification
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 1h
  enabled: false
timerange:
  extend_lookback: 30m
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.event_time AS event_time,
          a.action_name AS action,
          CASE WHEN a.response.status_code = 200 THEN 'Success' ELSE 'Failure' END AS status,
          a.user_identity.email AS actor,
          CASE
            WHEN a.action_name = 'workspaceConfEdit' THEN concat_ws(', ', transform(
              filter(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key IN ('enableVerboseAuditLogs', 'enableIpAccessLists', 'customerApprovedWSLoginExpirationTime', 'maxTokenLifetimeDays')),
              c -> concat(c.key, ': ', coalesce(c.value, 'N/A'))))
            WHEN a.action_name IN ('createIpAccessList', 'updateIpAccessList', 'deleteIpAccessList')
              THEN CONCAT('IP Access List ', a.action_name, ' (id ',
                          COALESCE(a.request_params['ipAccessListId'], 'unknown'), ')')
            ELSE 'Unknown Configuration'
          END AS config_change,
          CASE
            WHEN a.action_name = 'workspaceConfEdit'
             AND exists(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key IN ('enableVerboseAuditLogs', 'enableIpAccessLists') AND lower(c.value) = 'false')
              THEN 'CRITICAL - Audit Logging or IP Access Lists Disabled'
            WHEN a.action_name = 'deleteIpAccessList' THEN 'HIGH - IP Access List Deleted'
            WHEN a.action_name IN ('createIpAccessList', 'updateIpAccessList')
              THEN 'MEDIUM - IP Access List Modified'
            WHEN a.action_name = 'workspaceConfEdit'
             AND exists(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key = 'customerApprovedWSLoginExpirationTime')
              THEN 'MEDIUM - Change to Databricks Employee Access Config'
            WHEN a.action_name = 'workspaceConfEdit'
             AND exists(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key = 'maxTokenLifetimeDays')
              THEN 'MEDIUM - Maximum Token Lifetime Changed'
            ELSE 'MEDIUM - Configuration Change'
          END AS severity,
          a.audit_level AS audit_level,
          a.source_ip_address AS source_ip,
          a.user_agent AS user_agent,
          a.request_params AS request_params
        FROM {{audit_table}} AS a
        WHERE IN_TIMERANGE(a.event_time)
          AND (
            a.action_name IN ('createIpAccessList', 'updateIpAccessList', 'deleteIpAccessList')
            OR (a.action_name = 'workspaceConfEdit'
                AND exists(transform(split(COALESCE(a.request_params['workspaceConfKeys'], ''), ','), (k, i) -> named_struct('key', trim(k), 'value', trim(try_element_at(split(COALESCE(a.request_params['workspaceConfValues'], ''), ','), i + 1)))), c -> c.key IN ('enableVerboseAuditLogs', 'enableIpAccessLists', 'customerApprovedWSLoginExpirationTime', 'maxTokenLifetimeDays')))
          )
output:
  summary: '{severity}: {config_change} by {actor}'
  event_time_column: event_time
  context:
    event_time: '{event_time}'
    action: '{action}'
    status: '{status}'
    actor: '{actor}'
    config_change: '{config_change}'
    severity: '{severity}'
    audit_level: '{audit_level}'
    source_ip: '{source_ip}'
    user_agent: '{user_agent}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/event-based/configuration_changes_high_priority.py
  source_function: detect_config_changes_high_priority
