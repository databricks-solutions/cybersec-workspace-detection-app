catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_secret_bulk_read_burst
description: A principal reads far more distinct secrets in one run than its own busiest hour of the last 30 days,
  after enumerating scopes, or from outside Databricks compute.
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  Secret harvesting, the most common collection step after a credential is stolen. Per principal, the rule counts
  distinct secrets read (workspace:scope:key of getSecret with status 200) in the run window and reports at least
  15 when one of these holds: the count is at least 3 times the principal's busiest hour in the 30 days before;
  the principal listed scopes or keys in the same window (enumerate then read); or a read came from a public IP
  that is not Databricks platform egress (REST from the actor's host rather than a job on a cluster). In-cluster
  reads come from cluster egress, so look for the actor's IP on the principal's command or job activity. False
  positives: a new job that reads many secrets on its first run; a secret-rotation or migration script.
mitre:
- {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1552, technique: Unsecured Credentials,
   sub_technique_id: T1552.001, sub_technique: Credentials In Files}
- {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1555, technique: Credentials from Password Stores}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH platform_ips AS (
        -- Platform egress: IPs Databricks itself authenticates from. An IP counts when it carries a
        -- cluster-internal PAT or in-house OAuth token, or the in-house OAuth client action (Apps,
        -- serverless) from a private address, or that action from a public address at service volume:
        -- one principal at least 200 times in a day. A laptop calling a Databricks App logs the same
        -- action from its own IP, far less often, so it stays in scope. Two days back, so a full day
        -- of service traffic is always in view.
        SELECT ip FROM (
          SELECT p.source_ip_address AS ip, p.user_identity.email AS principal, to_date(p.event_time) AS auth_day,
                 count_if(p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')) AS internal_auth,
                 count_if(p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication')) AS inhouse_auth
          FROM {{audit_table}} AS p
          WHERE p.event_time >= TIMERANGE_NOW() - INTERVAL 2 DAYS AND p.event_time < TIMERANGE_NOW()
            AND (p.request_params['authenticationMethod'] IN ('API_INT_PAT_TOKEN', 'API_INHOUSE_OAUTH_TOKEN')
                 OR p.action_name IN ('workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication'))
          GROUP BY p.source_ip_address, p.user_identity.email, to_date(p.event_time)
        ) AS platform_days
        GROUP BY ip
        HAVING sum(internal_auth) > 0
            OR (sum(inhouse_auth) > 0 AND ip RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])')
            OR max(inhouse_auth) >= 200
      ),
      s AS (
        SELECT a.user_identity.email AS actor, a.event_time, a.action_name, a.workspace_id,
               a.request_params['scope'] AS scope, a.request_params['key'] AS secret_key,
               a.response.status_code AS status, a.source_ip_address AS src_ip,
               (a.source_ip_address IS NOT NULL AND NOT a.source_ip_address RLIKE '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
                AND pi.ip IS NULL) AS public_source
        FROM {{audit_table}} AS a
        LEFT JOIN platform_ips AS pi ON a.source_ip_address = pi.ip
        WHERE a.service_name = 'secrets'
          AND a.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time < TIMERANGE_NOW()
          AND a.user_identity.email IS NOT NULL
      ),
      win AS (
        SELECT actor,
               count(DISTINCT CASE WHEN action_name = 'getSecret' AND status = 200
                                   THEN concat_ws(':', workspace_id, scope, secret_key) END) AS keys_read,
               count(DISTINCT CASE WHEN action_name = 'getSecret' AND status = 200
                                   THEN concat_ws(':', workspace_id, scope) END) AS scopes_read,
               count(DISTINCT workspace_id) AS workspaces,
               count_if(action_name IN ('listScopes', 'listSecrets')) AS enum_calls,
               max(action_name = 'getSecret' AND public_source) AS off_runtime,
               min(event_time) AS first_time, max(event_time) AS event_time,
               max_by(src_ip, CASE WHEN public_source THEN 1 ELSE 0 END) AS src_ip,
               concat_ws(', ', slice(array_sort(collect_set(src_ip)), 1, 5)) AS source_ips
        FROM s WHERE IN_TIMERANGE(event_time)
        GROUP BY actor
      ),
      base AS (
        SELECT actor, max(keys) AS max_hourly FROM (
          SELECT actor, date_trunc('HOUR', event_time) AS hr,
                 count(DISTINCT concat_ws(':', workspace_id, scope, secret_key)) AS keys
          FROM s
          WHERE action_name = 'getSecret' AND status = 200
            AND event_time < TIMERANGE_NOW() - INTERVAL 2 HOURS
          GROUP BY actor, date_trunc('HOUR', event_time))
        GROUP BY actor
      )
      SELECT w.event_time AS event_time,
             w.actor AS actor,
             CASE WHEN w.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                  THEN 'sp' ELSE 'user' END AS actor_kind,
             w.src_ip AS src_ip,
             w.keys_read AS keys_read,
             w.scopes_read AS scopes_read,
             w.workspaces AS workspaces,
             w.enum_calls AS enum_calls,
             w.off_runtime AS off_runtime,
             coalesce(b.max_hourly, 0) AS baseline_max_hourly,
             w.source_ips AS source_ips,
             w.first_time AS first_time
      FROM win AS w LEFT JOIN base AS b ON b.actor = w.actor
      WHERE w.keys_read >= 15
        AND (w.keys_read >= 3 * coalesce(b.max_hourly, 0) OR w.enum_calls > 0 OR w.off_runtime)
output:
  summary: '{actor} read {keys_read} secrets in {scopes_read} scopes (busiest hour before: {baseline_max_hourly})'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    keys_read: '{keys_read}'
    scopes_read: '{scopes_read}'
    workspaces: '{workspaces}'
    enum_calls: '{enum_calls}'
    off_runtime: '{off_runtime}'
    baseline_max_hourly: '{baseline_max_hourly}'
    source_ips: '{source_ips}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. Is this a known job (secret rotation, a new pipeline's first run)? Check the principal's jobs and commands.
  2. off_runtime = true means reads over REST from src_ip: who owns that IP, and what client was used?
  3. Treat every secret read as exposed: rotate them, starting with credential-shaped keys (tokens, passwords, keys).
annotations:
  source: cybersec-workspace-detection-app
  family: secret_bulk_read_burst
