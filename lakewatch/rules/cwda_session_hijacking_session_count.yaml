# Generated by lakewatch/tools/build_rules.py from detect_session_high_count_per_ip (base/detections/behavioral/session_hijacking_session_count.py).
# Do not edit: change the detection, then run `uv run lakewatch/tools/build_rules.py`.
catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwda_session_hijacking_session_count
description: Detects user sessions reused across multiple public IPs or devices within a short timeframe.
severity: Low
category: Behavioral
fidelity: FIDELITY_INVESTIGATIVE
objective: Identify suspicious reuse of authenticated sessions by tracking access patterns that involve multiple
  distinct public IP addresses or user agents within a 24-hour period, indicating potential session hijacking or
  credential sharing.
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule:
  at_least_every: 24h
  enabled: false
timerange:
  extend_lookback: 1h
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      SELECT
          a.source_ip_address AS source_ip,
          COUNT(DISTINCT COALESCE(a.session_id, a.request_params['tokenId'], a.request_params['client_id'])) AS distinct_sessions,
          COUNT(DISTINCT a.user_identity.email) AS distinct_actors,
          CONCAT_WS(', ', COLLECT_SET(a.user_identity.email)) AS actors,
          CONCAT_WS(', ', COLLECT_SET(a.user_agent)) AS user_agents,
          MIN(a.event_time) AS first_seen,
          MAX(a.event_time) AS last_seen,
          COUNT(*) AS events
        FROM {{audit_table}} AS a
        WHERE IN_TIMERANGE(a.event_time)
          -- Token and OAuth logins carry no session_id; count their token / client id as the credential.
          AND COALESCE(a.session_id, a.request_params['tokenId'], a.request_params['client_id']) IS NOT NULL
          AND NOT a.source_ip_address RLIKE
              '^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.|127\\.|169\\.254\\.|(?i)f[cd][0-9a-f]{2}:)'
          AND NOT COALESCE(a.user_agent, '') RLIKE
              'Databricks-Service/driver|Databricks-Runtime|Delta-Sharing-SparkStructuredStreaming|RawDBHttpClient|wsfs/|mlflow-python|feature-store'
        GROUP BY a.source_ip_address
        HAVING COUNT(DISTINCT COALESCE(a.session_id, a.request_params['tokenId'], a.request_params['client_id'])) >= 5
output:
  summary: '{distinct_sessions} credentials of {distinct_actors} identities from {source_ip}'
  event_time_column: last_seen
  context:
    source_ip: '{source_ip}'
    distinct_sessions: '{distinct_sessions}'
    distinct_actors: '{distinct_actors}'
    actors: '{actors}'
    user_agents: '{user_agents}'
    first_seen: '{first_seen}'
    last_seen: '{last_seen}'
    events: '{events}'
    actor: '{actors}'
    src_ip: '{source_ip}'
  default_context: false
annotations:
  source: cybersec-workspace-detection-app
  source_notebook: base/detections/behavioral/session_hijacking_session_count.py
  source_function: detect_session_high_count_per_ip
