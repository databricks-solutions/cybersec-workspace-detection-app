catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_sql_credential_hunting
description: SQL that hunts for credentials -- information_schema searches for credential-named tables or columns,
  SELECTs of credential columns, read_files() content greps for key formats, or repeated secret() calls.
severity: Medium
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  Credential hunting through SQL. Reads system.query.history. Per principal, client application and hour in the
  run window, the rule counts statements that search information_schema with LIKE/RLIKE/ILIKE for secret,
  password, token, api_key, private_key, access_key or credential; select a password, api_key, access_key or
  client_secret column; grep file contents through read_files() for key formats (dapi, AKIA, ghp_, sk-, private
  key, jdbc:); and call secret(). It reports one hunting statement, or at least 3 secret() calls. Statement text is
  used to classify and never returned: it can hold the values found. False positives: data-governance and
  classification scanners on a schedule (allow-list their principals).
mitre:
- {taxonomy: Enterprise, tactic: Credential Access, technique_id: T1552, technique: Unsecured Credentials}
- {taxonomy: Enterprise, tactic: Discovery, technique_id: T1083, technique: File and Directory Discovery}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH q AS (
        SELECT executed_by, client_application, start_time, statement_id, lower(statement_text) AS t
        FROM system.query.history
        WHERE IN_TIMERANGE(start_time)
          AND statement_text IS NOT NULL
          -- this rule's own text (Lakewatch or a test running it) is not a hunt
          AND lower(statement_text) NOT LIKE '%schema_searches%'
      ),
      scored AS (
        SELECT executed_by, client_application, date_trunc('HOUR', start_time) AS hr,
               count_if(t LIKE '%information_schema%'
                        AND t RLIKE '(secret|passw|api_?key|private_key|access_key|client_secret|refresh_token|credential|token)'
                        AND t RLIKE '\\b(like|rlike|ilike|regexp)\\b') AS schema_searches,
               count_if(t RLIKE 'select\\s[^;]*\\b(password|passwd|api_key|apikey|access_key|client_secret)\\b') AS credential_selects,
               count_if(t LIKE '%read_files(%'
                        AND t RLIKE '(dapi|akia|ghp_|sk-|secret|passw|token|account_?key|private key|jdbc:)') AS read_files_greps,
               count_if(t RLIKE '\\bsecret\\s*\\(') AS secret_fn_calls,
               min(start_time) AS first_time, max(start_time) AS event_time,
               concat_ws(', ', slice(array_sort(collect_set(statement_id)), 1, 10)) AS statement_ids
        FROM q
        GROUP BY executed_by, client_application, date_trunc('HOUR', start_time)
      )
      SELECT event_time, executed_by AS actor,
             CASE WHEN executed_by RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             client_application, hr, schema_searches, credential_selects, read_files_greps, secret_fn_calls,
             statement_ids, first_time
      FROM scored
      WHERE schema_searches + credential_selects + read_files_greps >= 1 OR secret_fn_calls >= 3
output:
  summary: '{actor} hunted for credentials in SQL: {schema_searches} schema searches, {credential_selects} credential selects, {read_files_greps} file greps, {secret_fn_calls} secret() calls'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    client_application: '{client_application}'
    schema_searches: '{schema_searches}'
    credential_selects: '{credential_selects}'
    read_files_greps: '{read_files_greps}'
    secret_fn_calls: '{secret_fn_calls}'
    statement_ids: '{statement_ids}'
    first_time: '{first_time}'
  default_context: false
runbook: |
  1. Is actor a governance or classification scanner? If so, allow-list it.
  2. Open the statements (statement_ids in system.query.history) with care: results may contain credentials.
  3. Rotate any credential the statements could have returned; check how the actor signed in.
annotations:
  source: cybersec-workspace-detection-app
  family: sql_credential_hunting
