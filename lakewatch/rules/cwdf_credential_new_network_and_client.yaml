catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_credential_new_network_and_client
description: An external credential (personal access token or service principal OAuth secret) is used from a network
  and a client family that this credential has never used.
severity: High
category: Behavioral
fidelity: FIDELITY_HIGH
objective: >-
  Leaked-credential replay. A successful external PAT login (tokenLogin, API_EXT_PAT_TOKEN) or a service principal
  OAuth authentication (mintOAuthToken, oidcTokenAuthorization, workspace/accountInHouseOAuthClientAuthentication)
  arrives from a public /24 AND with a user-agent family (the product token before '/') that are both absent from
  that credential's own history in the 30 days before. A replayed token moves to a new host and a new tool (curl,
  python-requests, Python-urllib, Go-http-client) at the same time; an owner who changes network usually keeps the
  client, and an SDK upgrade changes the version, not the family. Requires both conditions and at least 3 days of
  history for the credential. Brand-new credentials are out of scope (see the dormant and minting rules). False
  positives: an owner who moves to a new network and a new tool on the same day; a CI system migrated to new
  runners with a different client.
mitre:
- {taxonomy: Enterprise, tactic: Initial Access, technique_id: T1078, technique: Valid Accounts,
   sub_technique_id: T1078.004, sub_technique: Cloud Accounts}
- {taxonomy: Enterprise, tactic: Defense Evasion, technique_id: T1550, technique: Use Alternate Authentication Material,
   sub_technique_id: T1550.001, sub_technique: Application Access Token}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24h
schedule: {at_least_every: 1h, enabled: false}
timerange: {extend_lookback: 30m}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH auth AS (
        SELECT coalesce(a.request_params['tokenId'], a.user_identity.email) AS credential,
               a.user_identity.email AS actor,
               a.action_name AS action,
               a.event_time,
               a.source_ip_address AS src_ip,
               coalesce(nullif(regexp_extract(a.source_ip_address, '^([0-9]+[.][0-9]+[.][0-9]+)[.]', 1), ''),
                        a.source_ip_address) AS net24,
               lower(regexp_extract(coalesce(a.user_agent, ''), '^([A-Za-z][A-Za-z0-9._-]*)', 1)) AS ua_family,
               a.user_agent
        FROM {{audit_table}} AS a
        WHERE a.event_time >= TIMERANGE_NOW() - INTERVAL 32 DAYS AND a.event_time < TIMERANGE_NOW()
          AND a.response.status_code = 200
          AND ((a.action_name = 'tokenLogin' AND a.request_params['authenticationMethod'] = 'API_EXT_PAT_TOKEN')
               OR (a.action_name IN ('mintOAuthToken', 'oidcTokenAuthorization',
                                     'workspaceInHouseOAuthClientAuthentication', 'accountInHouseOAuthClientAuthentication')
                   AND a.user_identity.email RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
          AND NOT a.source_ip_address RLIKE
              '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|127[.])'
      ),
      candidates AS (
        SELECT credential, actor, net24, ua_family,
               min(event_time) AS first_time, max(event_time) AS event_time, count(*) AS events,
               max_by(src_ip, event_time) AS src_ip, max_by(user_agent, event_time) AS user_agent,
               max_by(action, event_time) AS action
        FROM auth
        WHERE IN_TIMERANGE(event_time)
        GROUP BY credential, actor, net24, ua_family
      ),
      with_history AS (
        SELECT c.* FROM candidates AS c
        LEFT SEMI JOIN auth AS h
          ON h.credential = c.credential AND h.event_time < c.first_time - INTERVAL 3 DAYS
      ),
      new_network AS (
        SELECT c.* FROM with_history AS c
        LEFT ANTI JOIN auth AS h
          ON h.credential = c.credential AND h.net24 = c.net24
         AND h.event_time < c.first_time AND h.event_time >= c.first_time - INTERVAL 30 DAYS
      )
      SELECT c.event_time AS event_time,
             c.actor AS actor,
             CASE WHEN c.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                  THEN 'sp' ELSE 'user' END AS actor_kind,
             c.src_ip AS src_ip,
             c.credential AS credential,
             c.net24 AS net24,
             c.ua_family AS ua_family,
             c.user_agent AS user_agent,
             c.action AS action,
             c.first_time AS first_time,
             c.events AS events
      FROM new_network AS c
      LEFT ANTI JOIN auth AS h
        ON h.credential = c.credential AND h.ua_family = c.ua_family
       AND h.event_time < c.first_time AND h.event_time >= c.first_time - INTERVAL 30 DAYS
output:
  summary: '{actor_kind} {actor}: credential used from new network {net24} with new client {ua_family}'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    src_ip: '{src_ip}'
    credential: '{credential}'
    net24: '{net24}'
    ua_family: '{ua_family}'
    user_agent: '{user_agent}'
    action: '{action}'
    first_time: '{first_time}'
    events: '{events}'
  default_context: false
runbook: |
  1. Look up src_ip and net24: is it a company range (VPN, office, CI egress)? Is ua_family a tool the owner uses?
  2. List what the credential did from src_ip after first_time (same actor, same IP): secrets, exports, admin changes.
  3. If the use is not expected, revoke the credential (the PAT, or rotate the service principal secret) and find
     where it was stored.
annotations:
  source: cybersec-workspace-detection-app
  family: credential_new_network_and_client
