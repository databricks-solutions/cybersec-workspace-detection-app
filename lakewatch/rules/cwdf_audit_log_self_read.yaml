catalog_name: '{{catalog}}'
schema_name: '{{schema}}'
rule_name: cwdf_audit_log_self_read
description: A principal with no read of the audit log in the 90 days before starts reading system.access.audit.
severity: Low
category: Behavioral
fidelity: FIDELITY_MEDIUM
objective: >-
  An actor holding a credential checks what the customer can see. Daily, from system.access.table_lineage, the rule
  reports a principal that read system.access.audit in the run window and had no such read in the 90 days before.
  Reading system tables is common, so allow-list security and platform staff and the Lakewatch run-as principal;
  pair a hit with other alerts on the same principal (escalate when another alert fires within 24 hours). Reads of an
  exported audit table or volume through read_files() are not in lineage. False positives: new security staff, SIEM
  onboarding, new dashboards.
mitre:
- {taxonomy: Enterprise, tactic: Discovery, technique_id: T1518, technique: Software Discovery,
   sub_technique_id: T1518.001, sub_technique: Security Software Discovery}
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 7d
schedule: {at_least_every: 24h, enabled: false}
timerange: {extend_lookback: 1h}
batch:
  warehouse_id: '{{warehouse_id}}'
  sql:
    query: |
      WITH reads AS (
        SELECT l.created_by AS actor, l.source_table_full_name AS table_read, l.event_time
        FROM system.access.table_lineage AS l
        WHERE l.source_table_full_name = 'system.access.audit'
          AND l.event_time > TIMERANGE_NOW() - INTERVAL 92 DAYS AND l.event_time <= TIMERANGE_NOW()
          AND l.created_by IS NOT NULL
      )
      SELECT max(r.event_time) AS event_time, r.actor AS actor,
             CASE WHEN r.actor RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN 'sp' ELSE 'user' END AS actor_kind,
             r.table_read AS table_read, min(r.event_time) AS first_read, count(*) AS reads
      FROM reads AS r
      LEFT ANTI JOIN (SELECT DISTINCT actor FROM reads WHERE event_time < TIMERANGE_NOW() - INTERVAL 26 HOURS) AS p
        ON p.actor = r.actor
      WHERE IN_TIMERANGE(r.event_time)
      GROUP BY r.actor, r.table_read
output:
  summary: '{actor} read the audit log for the first time in 90 days ({reads} reads)'
  event_time_column: event_time
  context:
    actor: '{actor}'
    actor_kind: '{actor_kind}'
    table_read: '{table_read}'
    first_read: '{first_read}'
    reads: '{reads}'
  default_context: false
runbook: |
  1. Is the principal new security or platform staff, or a new tool? If so, allow-list it.
  2. Any other alert on the principal in the last 24 hours makes this an actor checking its trail.
annotations:
  source: cybersec-workspace-detection-app
  family: audit_log_self_read
